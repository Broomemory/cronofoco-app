name: Build Cronofoco APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 está abandonado e quebra sob o
      # runtime Node.js 24 que o GitHub passou a forçar em runs de Actions
      # (falha em segundos, antes de qualquer step real rodar). O runner
      # ubuntu-latest já vem com o Android SDK pré-instalado (ANDROID_HOME
      # aponta pra ele), mas o binário sdkmanager NÃO está no PATH por
      # padrão (tentativa anterior falhou com "exit code 127" = comando não
      # encontrado) — por isso localizamos o binário dinamicamente e
      # adicionamos o diretório dele ao PATH antes de usá-lo.
      - name: Locate Android sdkmanager and add to PATH
        run: |
          set -e
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager não encontrado sob $ANDROID_HOME" >&2
            exit 1
          fi
          dirname "$SDKMANAGER_PATH" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform/build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronofoco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publica num release público de tag fixa, com URL de download previsível
      # (github.com/.../releases/download/build-latest/app-debug.apk), que dá pra
      # baixar sem autenticação — ambientes com acesso restrito à API do GitHub
      # (como o sandbox usado pra disparar este build) conseguem buscar o APK assim.
      - name: Clean up previous release
        run: |
          gh release delete build-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: "Cronofoco — último build"
          body: "APK de debug gerado automaticamente a partir do commit ${{ github.sha }}."
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
