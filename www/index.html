<title>Cronofoco - Broomemory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --surface-2:#E9EEF6;
    --ink:#121A2C;
    --ink-muted:#5B6B85;
    --border:#DCE3EE;
    --accent:#0D9488;
    --accent-ink:#FFFFFF;
    --accent-soft:#D8F2EE;
    --accent-2:#22D3EE;
    --accent-3:#1E3A5F;
    --accent-grad:linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
    --gold:#93711E;
    --silver:#6B7480;
    --bronze:#8C5A34;
    --danger:#A93A3A;
    --danger-soft:#F5DEDE;
    --shadow: 0 1px 2px rgba(15,40,60,.06), 0 10px 28px -14px rgba(15,60,80,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0F1C;
      --surface:#111928;
      --surface-2:#182236;
      --ink:#E8ECF5;
      --ink-muted:#8E9CBB;
      --border:#25304A;
      --accent:#2DD4BF;
      --accent-ink:#07140F;
      --accent-soft:#123B37;
      --accent-2:#67E8F9;
      --accent-3:#0B4F6C;
      --accent-grad:linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
      --gold:#D8AE55;
      --silver:#A7B0B9;
      --bronze:#C8895C;
      --danger:#E08080;
      --danger-soft:#3A2020;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0F1C;
    --surface:#111928;
    --surface-2:#182236;
    --ink:#E8ECF5;
    --ink-muted:#8E9CBB;
    --border:#25304A;
    --accent:#2DD4BF;
    --accent-ink:#07140F;
    --accent-soft:#123B37;
    --accent-2:#67E8F9;
    --accent-3:#0B4F6C;
    --accent-grad:linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
    --gold:#D8AE55;
    --silver:#A7B0B9;
    --bronze:#C8895C;
    --danger:#E08080;
    --danger-soft:#3A2020;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono','Courier New',monospace; font-variant-numeric:tabular-nums;}
  button{font:inherit; color:inherit;}
  input{font:inherit;}
  a{color:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding-block:28px 64px;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:38px; height:38px; border-radius:12px; background:var(--accent-grad); box-shadow:0 6px 16px -6px rgba(13,148,136,.55); display:flex; align-items:center; justify-content:center; flex:none;}
  .brand h1{font-size:1.35rem; font-weight:700; letter-spacing:.2px; background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  nav.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:14px;}
  nav.tabs button{
    border:none; background:transparent; padding:8px 14px; border-radius:10px; cursor:pointer;
    font-size:.88rem; font-weight:500; color:var(--ink-muted);
  }
  nav.tabs button[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:26px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow);}
  .stat .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-muted); font-weight:600;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums;}

  /* ---------- exercise cards ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media (max-width:640px){ .grid-cards{grid-template-columns:1fr;} }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;
  }
  .card .head{display:flex; align-items:flex-start; gap:12px;}
  .card .icon{
    width:46px; height:46px; border-radius:14px; background:var(--accent-grad); color:#fff;
    box-shadow:0 6px 14px -6px rgba(13,148,136,.5);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .card h3{font-size:1.1rem; font-weight:600;}
  .card p{margin:0; color:var(--ink-muted); font-size:.9rem; line-height:1.45;}
  .card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:10px;}
  .last-chip{font-size:.78rem; color:var(--ink-muted); display:flex; align-items:center; gap:6px;}
  .medal-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .btn{
    border:none; border-radius:12px; padding:10px 16px; font-weight:600; cursor:pointer; font-size:.9rem;
    background:var(--accent-grad); color:var(--accent-ink); white-space:nowrap;
    box-shadow:0 6px 16px -8px rgba(13,148,136,.6);
  }
  .btn.secondary{background:var(--surface-2); color:var(--ink);}
  .btn.ghost{background:transparent; color:var(--ink-muted); padding:8px 10px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- trilha (progressão de desbloqueio dos exercícios) ----------
     Mostrar os 15 exercícios todos abertos de uma vez assusta quem está começando.
     Em vez disso, uma trilha: alguns exercícios "de entrada" ficam liberados desde o
     primeiro acesso, e o resto vai abrindo conforme a pessoa treina — cada exercício
     bloqueado continua visível (dá vontade de saber o que vem), só não é clicável. */
  .track-bar{display:flex; align-items:center; gap:12px; margin:-8px 0 22px;}
  .track-bar .track-label{font-size:.82rem; color:var(--ink-muted); white-space:nowrap;}
  .track-track{flex:1; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .track-fill{height:100%; background:var(--accent-grad); transition:width .4s ease;}
  .unlock-banner{
    display:flex; align-items:center; gap:12px; background:var(--accent-soft); color:var(--accent);
    border-radius:14px; padding:14px 16px; margin-bottom:18px; font-weight:600; font-size:.92rem;
  }
  .unlock-banner button{
    margin-left:auto; border:none; background:transparent; color:var(--accent); font-weight:700;
    cursor:pointer; font-size:.82rem; text-decoration:underline; flex:none;
  }
  .card.locked{opacity:.62;}
  .card.locked .icon{background:var(--surface-2); color:var(--ink-muted); box-shadow:none;}
  .card.locked h3{color:var(--ink-muted);}
  .lock-req{display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-muted); font-weight:600;}
  .lock-req .mini-track{width:56px; height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; flex:none;}
  .lock-req .mini-fill{height:100%; background:var(--ink-muted);}

  /* ---------- gate de acesso (licença) ----------
     A página inteira fica escondida atrás desta tela até liberar com um código de acesso
     válido. É proteção do lado do navegador (o código só é comparado por hash, nunca fica
     em texto puro na página) — levanta a barreira contra repasse casual do link, mas não é
     à prova de alguém decidido a burlar. Rotacionar/revogar um código = remover o hash da
     lista e republicar. */
  .gate-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:32px 28px; box-shadow:var(--shadow); text-align:center;}
  .gate-card .mark{width:46px; height:46px; border-radius:14px; background:var(--accent-grad); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(13,148,136,.55);}
  .gate-card h1{font-size:1.3rem; margin-bottom:6px;}
  .gate-sub{color:var(--ink-muted); font-size:.88rem; margin-bottom:22px; line-height:1.5;}
  .gate-field{margin-bottom:14px; text-align:left;}
  .gate-field label{display:block; font-size:.78rem; font-weight:600; color:var(--ink-muted); margin-bottom:6px;}
  .gate-input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:center; letter-spacing:.06em;
    border:2px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface); color:var(--ink);
  }
  .gate-input:focus-visible{border-color:var(--accent);}
  .gate-error{color:var(--danger); font-size:.82rem; min-height:18px; margin:10px 0 4px;}
  .gate-footnote{color:var(--ink-muted); font-size:.78rem; margin-top:18px; line-height:1.5;}
  .license-badge{font-size:.72rem; color:var(--ink-muted); font-weight:500;}

  /* ---------- exercise view shell ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:26px; box-shadow:var(--shadow);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .panel-head h2{font-size:1.25rem;}
  .timer{font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:600; background:var(--surface-2); padding:6px 12px; border-radius:9px;}
  .progress-track{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--accent-grad); transition:width .2s ease;}

  /* calc exercise */
  .calc-stage{display:flex; flex-direction:column; align-items:center; gap:22px; padding:24px 0 8px;}
  .calc-question-row{display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap;}
  .calc-qcount{white-space:nowrap;}
  .calc-expr{font-family:'IBM Plex Mono',monospace; font-size:2.6rem; font-weight:500; letter-spacing:.01em; display:flex; align-items:center; gap:10px;}
  .calc-expr .op{color:var(--accent); padding-inline:14px;}
  .calc-input{
    width:130px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:2.1rem; font-weight:600;
    border:2px solid var(--border); border-radius:12px; padding:6px 10px; background:var(--surface); color:var(--ink);
  }
  .calc-input.flash-ok{border-color:var(--accent);}
  .calc-input.flash-bad{border-color:var(--danger);}
  .calc-hint{color:var(--ink-muted); font-size:.85rem;}

  /* ---------- teclado numérico próprio do app (Cálculo Mental, modo digitar) ----------
     Em vez de depender do teclado do sistema (que no iPhone/navegadores embutidos não tem
     tecla Enter/Ir e fica longe do polegar), o app desenha o próprio teclado, sempre no
     mesmo lugar, com o botão Confirmar grande e junto dos números. */
  .numpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; width:100%; margin:0 auto;}
  .numpad button{
    border:1.5px solid var(--border); background:var(--surface); border-radius:14px; padding:16px 0;
    font-family:'IBM Plex Mono',monospace; font-size:1.35rem; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .numpad button:active{background:var(--surface-2);}
  .numpad button.numpad-clear{font-family:'Work Sans',sans-serif; font-size:1.1rem; color:var(--ink-muted); background:var(--surface-2);}
  .numpad button.numpad-confirm{
    background:var(--accent-grad); color:var(--accent-ink); border:none; font-family:'Work Sans',sans-serif;
    font-size:.92rem; font-weight:700;
  }

  /* digit span */
  .span-digit{font-family:'IBM Plex Mono',monospace; font-size:4rem; font-weight:700; text-align:center; min-height:96px; display:flex; align-items:center; justify-content:center;}

  /* pairs (jogo da memória) */
  .pairs-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; margin:8px 0 22px;}
  .pairs-card{
    aspect-ratio:1; border:none; border-radius:10px; background:var(--surface-2); color:var(--ink-muted);
    font-size:1.6rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .15s ease;
  }
  .pairs-card.flipped{background:var(--surface); border:2px solid var(--accent); color:var(--ink);}
  .pairs-card.matched{background:var(--accent-soft); border:2px solid var(--accent); color:var(--ink); cursor:default; opacity:.85;}

  /* stroop */
  .stroop-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px 18px; margin:18px 0 26px;}
  .stroop-word{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.15rem; text-align:center; letter-spacing:.02em; padding:6px 4px; border-radius:8px;}

  /* memorization */
  .duration-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .duration-picker button{
    border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 16px; cursor:pointer; font-weight:500;
  }
  .duration-picker button[aria-pressed="true"]{background:var(--accent-grad); border-color:var(--accent); color:var(--accent-ink);}
  .word-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px 16px; margin:8px 0 22px;}
  .word-tile{
    background:var(--surface-2); border-radius:10px; padding:12px 6px; text-align:center; font-weight:600;
    font-size:1.02rem; text-transform:uppercase; letter-spacing:.02em;
  }
  .memo-count{font-size:3rem; font-family:'IBM Plex Mono',monospace; text-align:center; font-weight:600; margin:6px 0 20px;}
  .missed-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .missed-list span{background:var(--danger-soft); color:var(--danger); border-radius:7px; padding:4px 10px; font-size:.85rem; font-weight:600; text-transform:uppercase;}
  .hit-list span{background:var(--accent-soft); color:var(--accent); border-radius:7px; padding:4px 10px; font-size:.85rem; font-weight:600; text-transform:uppercase;}

  /* flashcards */
  .flash-progress{text-align:center; color:var(--ink-muted); font-size:.85rem; margin-bottom:12px;}
  .flash-card{
    background:var(--surface-2); border-radius:18px; padding:44px 24px; min-height:150px;
    display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    font-size:1.25rem; font-weight:600; margin-bottom:20px; border:2px solid transparent; transition:border-color .15s ease, background .15s ease;
  }
  .flash-card:hover{border-color:var(--accent);}
  .flash-card.revealed{background:var(--accent-soft); cursor:default;}
  .flash-card .side-label{display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin-bottom:12px;}
  .flash-hint-tap{text-align:center; color:var(--ink-muted); font-size:.8rem; margin:-10px 0 20px;}
  .flash-rate-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;}
  .flash-rate-row button.rate-hard{background:var(--danger-soft); color:var(--danger); box-shadow:none;}
  .flash-rate-row button.rate-mid{background:var(--surface-2); color:var(--ink); box-shadow:none;}
  .flash-rate-row button.rate-easy{background:var(--accent-soft); color:var(--accent); box-shadow:none;}
  .flash-deck-grid{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}

  /* sudoku */
  .sudoku-toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
  select.diff{
    border:1px solid var(--border); border-radius:9px; padding:9px 12px; background:var(--surface); color:var(--ink); font-weight:500;
  }
  .sudoku-board{
    display:grid; grid-template-columns:repeat(9,1fr); gap:2px; background:var(--ink); border:2px solid var(--ink);
    max-width:414px; margin:0 auto; border-radius:6px; overflow:hidden;
  }
  .sudoku-board .cell{
    position:relative; aspect-ratio:1; background:var(--surface); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none;
    font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:600; padding:0; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .sudoku-board .cell.clue{background:var(--surface-2); color:var(--ink-muted);}
  .sudoku-board .cell.peer{background:color-mix(in srgb, var(--accent-soft) 55%, var(--surface));}
  .sudoku-board .cell.clue.peer{background:color-mix(in srgb, var(--accent-soft) 45%, var(--surface-2));}
  .sudoku-board .cell.same .val{color:var(--accent);}
  .sudoku-board .cell.selected{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent);}
  .sudoku-board .cell.conflict{background:var(--danger-soft); color:var(--danger);}
  .sudoku-board .cell.conflict .val{color:var(--danger);}
  .sudoku-board .cell .notes{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); width:100%; height:100%; padding:1px;}
  .sudoku-board .cell .notes span{display:flex; align-items:center; justify-content:center; font-size:.58rem; line-height:1; font-weight:600; color:var(--ink-muted);}
  .sudoku-board .cell .notes span.hl{color:var(--accent);}
  .sudoku-controls{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; max-width:414px; margin:14px auto 0;}
  .sudoku-pad{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:414px; margin:12px auto 0;}
  .sudoku-pad button{
    border:1.5px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 0;
    font-family:'IBM Plex Mono',monospace; font-size:1.25rem; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .sudoku-pad button:active{background:var(--surface-2);}
  .sudoku-pad.notes-on button:not(.sudoku-pad-erase){border-color:var(--accent); color:var(--accent); font-size:1rem; font-style:italic;}
  .sudoku-pad .sudoku-pad-erase{background:var(--surface-2); color:var(--ink-muted); font-family:'Work Sans',sans-serif;}
  .sudoku-hint{max-width:414px; margin:12px auto 0; text-align:center; line-height:1.45;}
  .sudoku-board .cell.br{border-right:2px solid var(--ink);}
  .sudoku-board .cell.bb{border-bottom:2px solid var(--ink);}
  .sudoku-msg{text-align:center; margin-top:18px; font-weight:600; color:var(--accent);}

  /* results */
  .result-hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:12px 0 24px;}
  .result-hero .big{font-family:'IBM Plex Mono',monospace; font-size:3rem; font-weight:700;}
  .medal-badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 16px; border-radius:999px; font-weight:600; font-size:.9rem;
    background:var(--surface-2);
  }
  .result-metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:18px 0 26px;}
  .result-metrics .m{background:var(--surface-2); border-radius:12px; padding:14px; text-align:center;}
  .result-metrics .m .v{font-family:'IBM Plex Mono',monospace; font-size:1.4rem; font-weight:600;}
  .result-metrics .m .l{font-size:.75rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.07em; margin-top:2px;}
  .actions-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  /* history */
  .hist-section{margin-bottom:26px;}
  .hist-section h3{font-size:1rem; margin-bottom:10px;}
  .hist-empty{color:var(--ink-muted); font-size:.9rem; padding:18px 0;}
  table.hist{width:100%; border-collapse:collapse; font-size:.88rem;}
  table.hist th{text-align:left; color:var(--ink-muted); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; padding:6px 10px; border-bottom:1px solid var(--border);}
  table.hist td{padding:8px 10px; border-bottom:1px solid var(--border); font-family:'IBM Plex Mono',monospace;}
  table.hist th.col-actions, table.hist td.col-actions{width:1%; white-space:nowrap; font-family:inherit;}
  .row-del-btn{background:transparent; color:var(--ink-muted); border:none; cursor:pointer; font-size:.95rem; padding:4px 9px; border-radius:8px; line-height:1;}
  .row-del-btn:hover{background:var(--danger-soft); color:var(--danger);}
  .row-del-btn.confirming{background:var(--danger-soft); color:var(--danger); font-weight:700; font-size:.72rem; padding:5px 9px;}
  .btn.ghost.confirming{background:var(--danger-soft); color:var(--danger);}
  .spark{display:block; overflow:visible;}
  .hist-row-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}

    var a = arr.slice();

  function genOperatorSequence(total){
    // "bag shuffle": concatenates shuffled [+,-,×] batches so the distribution stays even
    // but the order never repeats a fixed cycle the user could learn to predict.
    var seq = [];

  /* ============================= GATE DE ACESSO (LICENÇA) =============================
     O Cronofoco é vendido por acesso — quem tem o link, sem mais nada, poderia repassar
     pra qualquer pessoa. Esta tela bloqueia o app inteiro até um código de acesso válido
     ser digitado. O código nunca fica em texto puro na página: só o hash (SHA-256) fica
     aqui, então dá pra conferir sem guardar os códigos "abertos" no código-fonte. Não é à
     prova de alguém decidido a copiar/repassar o código já liberado, mas cria fricção real
     contra o repasse casual do link — e o nome de quem comprou fica fixo na tela (marca
     d'água), o que desestimula prints/repasse.
     Cada venda nova = uma linha nova aqui, com o hash do código e o nome do comprador —
     é só pedir pro Claude gerar o hash, adicionar e republicar (leva poucos segundos).
     Pra revogar um código vazado, basta remover a linha dele e republicar. */
  var LICENSE_KEY = "cronofoco_license_v1";
  var LICENSES = [
    // {h: "<sha256 do código, em maiúsculas>", n: "Nome de quem comprou"}
    // n preenchido = código de uma venda: a tela mostra sempre o nome do comprador (desestimula repasse).
    // n vazio ("") = código de teste/demonstração: a tela mostra o nome que a pessoa digitou.
    // Códigos de teste/demonstração atuais: BROOMEMORY, VASSOURA, TESTE
    // (a comparação já ignora maiúsculas/minúsculas — ver normalizeAccessCode)
    {h:"cd4d02bd5776d2a4d3e879557fdc69771d1a2b21044d6906b34bf18b5c8fbd23", n:""},
    {h:"8fde074ca42ca9b1e8ebc9f64057ad791d37c41b5729d5461a42c22b63293d3d", n:""},
    {h:"9aed541153e3f39cc0b4cfd1d2b1b1d2c99f660742055147505e7e8f5ef08070", n:""}
  ];

  function normalizeAccessCode(v){ return (v||"").toString().trim().toUpperCase().replace(/\s+/g,""); }

  function sha256Hex(str){
    var bytes = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", bytes).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }

  function loadLicense(){

  function unlockApp(lic){
    saveLicense(lic);

    if(gateScreen) gateScreen.style.display = "none";

  function renderGate(errorMsg){
    var gateScreen = $("#gateScreen");
    if(!gateScreen) return;
    gateScreen.innerHTML = "";
    var nameInput = el("input",{class:"gate-input", type:"text", autocomplete:"name", placeholder:"Seu nome", style:"text-transform:none;"});
    var codeInput = el("input",{class:"gate-input", type:"text", autocomplete:"off", autocapitalize:"characters", placeholder:"Código de acesso"});
    var errorEl = el("div",{class:"gate-error"},[errorMsg||""]);
    var submitBtn = el("button",{class:"btn", type:"button", style:"width:100%; justify-content:center;"},["Liberar acesso"]);

    function submit(){
      var name = (nameInput.value||"").trim();
      var code = normalizeAccessCode(codeInput.value);
      if(!name){ errorEl.textContent = "Digite seu nome."; nameInput.focus(); return; }
      if(!code){ errorEl.textContent = "Digite o código de acesso que você recebeu após a compra."; codeInput.focus(); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = "Verificando…";
      sha256Hex(code).then(function(hash){
        var match = LICENSES.filter(function(l){ return l.h === hash; })[0];
        if(match){
          unlockApp({n: match.n || name, h: hash});
        } else {
          errorEl.textContent = "Código inválido. Confira maiúsculas, espaços e hífens.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Liberar acesso";
        }
      }).catch(function(){
        errorEl.textContent = "Não foi possível verificar agora. Tente de novo.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Liberar acesso";
      });
    }
    submitBtn.addEventListener("click", submit);
    codeInput.addEventListener("keydown", function(ev){ if(ev.key === "Enter") submit(); });
    nameInput.addEventListener("keydown", function(ev){ if(ev.key === "Enter") codeInput.focus(); });

    gateScreen.appendChild(el("div",{class:"gate-card"},[
      el("div",{class:"mark", "aria-hidden":"true", html:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/><path d="M12 7v5l3.2 2" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>'}),
      el("h1",{},["Cronofoco"]),
      el("p",{class:"gate-sub"},["Acesso liberado só para quem comprou. Digite seu nome e o código de acesso que você recebeu."]),
      el("div",{class:"gate-field"},[el("label",{},["Nome"]), nameInput]),
      el("div",{class:"gate-field"},[el("label",{},["Código de acesso"]), codeInput]),
      errorEl,
      submitBtn,
      el("p",{class:"gate-footnote"},["Ainda não tem acesso? Fale com quem te enviou o link do Cronofoco."])
    ]));
    nameInput.focus();
  }

  /* ============================= VOZ (Web Speech API + ponte nativa Android) =============================
     No navegador (inclusive o Artifact publicado), a voz usa a Web Speech API normal. Dentro do app
     Android empacotado com Capacitor, a Web Speech API não existe na WebView — em vez dela, usamos o
     plugin @capacitor-community/speech-recognition, que fala com o SpeechRecognizer nativo do Android
     (pede a permissão RECORD_AUDIO, mesmo mecanismo dos apps do próprio Google).
     A ponte abaixo (NativeSpeechRecognitionShim) imita a forma como o restante do código já usa a Web
     Speech API (recognizer.lang, .continuous, .onresult, .onerror, .onend, .start(), .stop()) — assim
     nenhuma linha das telas de Cálculo Mental e Stroop precisa mudar; elas continuam chamando
     getSpeechCtor() normalmente e recebem o shim nativo sem saber a diferença. */
  function isNativePlatform(){
    try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
    catch(e){ return false; }
  }
  function nativeSpeechPlugin(){
    try{ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition; }
    catch(e){ return null; }
  }
  /* O reconhecedor nativo do Android só ouve UMA frase por vez: ele encerra sozinho após alguns
     segundos de silêncio (erro "No speech input"/"No match") ou ao fim de cada frase. Para imitar o
     modo contínuo do navegador, o shim reinicia a escuta por conta própria quando continuous=true,
     tratando silêncio/"não entendi" como algo normal (não como erro), e só dispara onend quando
     alguém chama stop() ou acontece um erro fatal (permissão negada / sem microfone).
     _nativeLastEnd garante um respiro mínimo entre uma sessão nativa e a próxima — reiniciar rápido
     demais faz o Android responder "RecognitionService busy"/"Client side error". */
  var _nativeLastEnd = 0;
  function NativeSpeechRecognitionShim(){
    this.lang = "pt-BR";
    this.continuous = false;
    this.interimResults = false;
    this.maxAlternatives = 3;
    this.onresult = null;
    this.onerror = null;
    this.onend = null;
    this._active = false;
    this._timer = null;
    this._retries = 0;
  }
  NativeSpeechRecognitionShim.prototype.start = function(){
    var self = this;
    var SR = nativeSpeechPlugin();
    if(!SR){ self._fireError("audio-capture"); return; }
    self._active = true;
    self._retries = 0;
    SR.requestPermissions().then(function(perm){
      if(!self._active) return;
      var granted = !perm || perm.speechRecognition === "granted" || perm.speechRecognition === undefined;
      if(!granted){ self._fireError("not-allowed"); return; }
      self._listen();
    }).catch(function(){
      if(self._active) self._fireError("not-allowed");
    });
  };
  NativeSpeechRecognitionShim.prototype._listen = function(){
    var self = this;
    var SR = nativeSpeechPlugin();
    if(!SR){ self._fireError("audio-capture"); return; }
    // Respiro mínimo desde a última sessão + recuo gradual se o Android estiver devolvendo erro seguido.
    var gap = 350 + Math.min(self._retries, 10) * 150;
    var wait = Math.max(0, gap - (Date.now() - _nativeLastEnd));
    if(self._timer) clearTimeout(self._timer);
    self._timer = setTimeout(function(){
      self._timer = null;
      if(!self._active) return;
      SR.start({
        language: self.lang || "pt-BR",
        maxResults: self.maxAlternatives || 3,
        partialResults: false,
        popup: false
      }).then(function(res){
        _nativeLastEnd = Date.now();
        if(!self._active) return;
        self._retries = 0;
        var matches = (res && res.matches) || [];
        if(matches.length && self.onresult){
          // Mesmo formato do evento do navegador: ev.resultIndex, ev.results[i].isFinal, ev.results[i][0].transcript
          var alts = matches.map(function(m){ return {transcript: m, confidence: 1}; });
          alts.isFinal = true;
          try{ self.onresult({resultIndex: 0, results: [alts]}); }catch(e){}
        }
        if(!self._active) return; // onresult pode ter encerrado o exercício (stop)
        if(self.continuous){ self._listen(); }
        else { self._active = false; if(self.onend){ try{ self.onend(); }catch(e){} } }
      }).catch(function(err){
        _nativeLastEnd = Date.now();
        if(!self._active) return;
        var msg = ((err && err.message) || String(err || "")).toLowerCase();
        if(msg.indexOf("permission") !== -1){ self._fireError("not-allowed"); return; }
        self._retries++;
        if(msg.indexOf("audio recording") !== -1 && self._retries > 3){ self._fireError("audio-capture"); return; }
        // Silêncio, "não entendi", serviço ocupado, erro de rede momentâneo: no modo contínuo só
        // volta a ouvir; no modo de uma frase só avisa "no-speech" (a tela de Cálculo reabre a escuta).
        if(self.continuous){ self._listen(); }
        else { self._fireError("no-speech"); }
      });
    }, wait);
  };
  NativeSpeechRecognitionShim.prototype._fireError = function(code){
    var self = this;
    self._active = false;
    if(self._timer){ clearTimeout(self._timer); self._timer = null; }
    if(self.onerror){ try{ self.onerror({error: code}); }catch(e){} }
    if(self.onend){ try{ self.onend(); }catch(e){} }
  };
  NativeSpeechRecognitionShim.prototype.stop = function(){
    this._active = false;
    if(this._timer){ clearTimeout(this._timer); this._timer = null; }
    _nativeLastEnd = Date.now();
    var SR = nativeSpeechPlugin();
    if(SR){ try{ SR.stop(); }catch(e){} }
  };

  function getSpeechCtor(){

  function inIframe(){

    // A framed page cannot get microphone permission unless its parent explicitly allows
    // it — Claude's frame doesn't — so SpeechRecognition fails instantly with "not-allowed"
    // and the browser never even shows the mic prompt. Opening the artifact's own URL in a
    // separate browser tab runs it top-level instead, where the normal prompt works.
    // Dentro do app Android (não é iframe nenhum) isso nunca se aplica.
    if(isNativePlatform()) return false;
    try{ return window.self !== window.top; }catch(e){ return true; }
  }
  function voiceUsable(){ return speechSupported() && !inIframe(); }
  function voiceUnavailableReason(){
    if(!speechSupported()) return "não suportado neste navegador";

    return "indisponível";

  // instead of the mode silently doing nothing. Dentro do app Android o próprio plugin nativo
  // cuida da permissão/hardware quando o modo voz é iniciado, então pulamos essa checagem.
  function micDeviceAvailable(){
    if(isNativePlatform()) return Promise.resolve(true);
    if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve(true);
    return navigator.mediaDevices.enumerateDevices().then(function(list){
      return list.some(function(d){ return d.kind === "audioinput"; });
    }).catch(function(){ return true; });

  function wordsToNumber(text){

    var groups = (text||"").match(/\d+/g);

    return wordsToNumber(text);
  }
  /* Separa TODOS os números de um texto falado, na ordem: "doze trinta e cinco 7" → [12, 35, 7].
     Junta dezena + unidade ("vinte e cinco", "vinte cinco" → 25) e centena ("cento e dez" → 110).
     Números colados a uma operação ("seis vezes sete", "6 x 7") são descartados — é a pessoa lendo
     a conta em voz alta, não a resposta. Inclui palavras que o reconhecedor costuma confundir
     ("Deus" → 10, "novo" → 9, "sem" → 100, "dose" → 12, "treis" → 3...). */
  var NUM_ALIASES = {"deus":10,"des":10,"dés":10,"novo":9,"sem":100,"hum":1,"dose":12,"doses":12,"treis":3,"trez":3,"tress":3,
    "sais":6,"seiz":6,"set":7,"seti":7,"oitu":8,"quatru":4,"sinco":5,"dezeseis":16,"dezesete":17,"dezasseis":16,"dezassete":17,
    "dezanove":19,"catorse":14,"quatorse":14,"cincoenta":50,"sesenta":60,"doiz":2,"dous":2};
  var NUM_OPS = {"mais":1,"menos":1,"vezes":1,"x":1,"por":1,"dividido":1,"op":1};
  function numWordValue(tok){
    if(PT_NUM_WORDS.hasOwnProperty(tok)) return PT_NUM_WORDS[tok];
    if(NUM_ALIASES.hasOwnProperty(tok)) return NUM_ALIASES[tok];
    return null;
  }
  function extractSpokenNumbers(text){
    var raw = normWord(text).replace(/[×*+÷\/]|(^|\s)-(\s|$)/g, " op ").replace(/=/g, " ");
    var toks = raw.split(/[^a-z0-9]+/).filter(Boolean);
    var items = [], cur = null;
    function flush(){ if(cur){ items.push({v:cur.v}); cur = null; } }
    for(var i=0;i<toks.length;i++){
      var t = toks[i];
      if(/^\d+$/.test(t)){ flush(); items.push({v:parseInt(t,10)}); continue; }
      if(NUM_OPS[t]){ flush(); items.push({op:true}); continue; }
      if(t === "e") continue;
      var v = numWordValue(t);
      if(v === null){ flush(); continue; }
      if(cur){
        if(cur.v >= 100 && cur.v % 100 === 0 && v < 100){ cur.v += v; cur.tens = (v >= 20 && v % 10 === 0); continue; }
        if(cur.tens && v >= 1 && v <= 9){ cur.v += v; cur.tens = false; continue; }
        flush();
      }
      cur = {v:v, tens:(v >= 20 && v < 100 && v % 10 === 0)};
    }
    flush();
    var out = [];
    for(var k=0;k<items.length;k++){
      if(items[k].op) continue;
      var prevOp = k > 0 && items[k-1].op, nextOp = k < items.length-1 && items[k+1].op;

  // O reconhecedor às vezes junta duas respostas seguidas num número só. Dado o número que já tinha
  // sido usado (prev) e como ele aparece agora (now), devolve a parte nova — ou null se não der
  // para explicar como "prev + algo depois". Ex.: 20→21 dá 1; 10→100 dá 0; 1→12 dá 2; 7→75 dá 5.
  function numberAddedTo(prev, now){
    if(prev >= 20 && prev < 100 && prev % 10 === 0 && now > prev && now - prev <= 9) return now - prev;
    if(prev >= 100 && prev % 100 === 0 && now > prev && now - prev < 100) return now - prev;
    var a = String(prev), b = String(now);
    if(b.length > a.length && b.indexOf(a) === 0) return parseInt(b.slice(a.length), 10);
    return null;
  }

    for(var i=0;i<texts.length;i++){

    return null;
  }
  // Variações que o reconhecedor costuma devolver para cada cor (feminino, plural, grafias erradas).
  var COLOR_ALIASES = {
    1:["azul","azuis","asul"],
    2:["vermelho","vermelha","vermelhos","vermelhas","vermelio"],
    3:["amarelo","amarela","amarelos","amarelas"],
    4:["verde","verdes","verdi"],
    5:["roxo","roxa","roxos","roxas","rocho","rouxo","ruxo","rocha","rosso","rosto","roche","rox","rock","roxy","hoxo","roco","rochos"],
    6:["laranja","laranjas"]
  };
  var COLOR_LOOKUP = (function(){
    var m = {};
    Object.keys(COLOR_ALIASES).forEach(function(id){ COLOR_ALIASES[id].forEach(function(w){ m[w] = +id; }); });
    return m;
  })();
  // Aproximação por "som": para palavras que não bateram exatamente, compara uma forma fonética
  // simplificada (x → ch, h inicial → r, final a/e/u → o...) com as cores, aceitando 1 letra de
  // diferença (2 nas palavras longas). Pega transcrições tortas como "Rochu" ou "vermeio".
  function colorPhon(w){
    return w.replace(/^h/,"r").replace(/x/g,"ch").replace(/ss/g,"s").replace(/rr/g,"r").replace(/lh/g,"li").replace(/[aeiu]$/,"o");
  }
  function editDist(a, b){
    var m = a.length, n = b.length, prev = [], cur2 = [];
    for(var j=0;j<=n;j++) prev[j] = j;
    for(var i=1;i<=m;i++){
      cur2 = [i];
      for(var j2=1;j2<=n;j2++) cur2[j2] = Math.min(prev[j2]+1, cur2[j2-1]+1, prev[j2-1] + (a[i-1] === b[j2-1] ? 0 : 1));
      prev = cur2;
    }
    return prev[n];
  }
  var COLOR_PHON = (function(){
    var list = [];
    // Verde e azul ficam de fora: há muitas palavras comuns a 1 letra delas ("vendo", "verba"...).
    COLORS.forEach(function(c){ if(c.id !== 1 && c.id !== 4) list.push({id:c.id, p:colorPhon(normWord(c.name))}); });
    return list;
  })();
  function fuzzyColor(tok){
    if(tok.length < 4) return null;
    var p = colorPhon(tok), best = null, bestD = 99;
    COLOR_PHON.forEach(function(c){
      var d = editDist(p, c.p);
      var limit = c.p.length >= 7 ? 2 : 1;
      if(d <= limit && d < bestD){ bestD = d; best = c.id; }
    });

  }
  function extractColorTokens(text){
    var norm = normWord(text);
    // O reconhecedor do Android costuma devolver pontuação ("Azul, vermelho.") — separa por
    // qualquer coisa que não seja letra/número, não só por espaço.
    var tokens = norm.split(/[^a-z0-9]+/).filter(Boolean);
    var out = [];
    for(var i=0;i<tokens.length;i++){
      var tok = tokens[i], next = tokens[i+1];
      // palavra cortada em duas: "a sul" → azul, "ver de" → verde
      if((tok === "a" || tok === "as" || tok === "ah") && next === "sul"){ out.push(1); i++; continue; }
      if(tok === "ver" && next === "de"){ out.push(4); i++; continue; }
      if(COLOR_LOOKUP.hasOwnProperty(tok)){ out.push(COLOR_LOOKUP[tok]); continue; }
      var fz = fuzzyColor(tok);
      if(fz !== null) out.push(fz);
    }
    return out;
  }

  /* Alinha as cores ouvidas (tokens) com as cores esperadas da grade (expected), como um "diff":
     cada palavra da grade vira "ok" (disse a cor certa), "bad" (disse outra cor) ou "miss" (o
     microfone não captou nenhuma palavra ali); palavras ouvidas que não se encaixam em nada são
     descartadas. Custos: acerto 0, cor errada 1, palavra não captada 1,2, palavra sobrando 1,5 —
     assim uma palavra perdida pelo reconhecedor vira um "miss" isolado em vez de deslocar todas
     as seguintes. Olha no máximo 4 palavras à frente por sessão do reconhecedor.
     Retorna {cells:[{state, heard}], consumed}. */
  function alignColorTokens(tokens, expected){
    var n = tokens.length, m = Math.min(expected.length, n + 4);
    var SUB = 1, SKIP = 1.2, INS = 1.5;
    var D = [], B = [];
    for(var i=0;i<=n;i++){ D.push(new Array(m+1)); B.push(new Array(m+1)); }
    D[0][0] = 0;
    for(var j=1;j<=m;j++){ D[0][j] = j*SKIP; B[0][j] = "skip"; }
    for(var i2=1;i2<=n;i2++){
      D[i2][0] = i2*INS; B[i2][0] = "ins";
      for(var j2=1;j2<=m;j2++){
        var diag = D[i2-1][j2-1] + (tokens[i2-1] === expected[j2-1] ? 0 : SUB);
        var ins = D[i2-1][j2] + INS;
        var skip = D[i2][j2-1] + SKIP;
        var best = diag, op = "diag";
        if(skip < best){ best = skip; op = "skip"; }
        if(ins < best){ best = ins; op = "ins"; }
        D[i2][j2] = best; B[i2][j2] = op;
      }
    }
    var end = 0;
    for(var e=1;e<=m;e++){ if(D[n][e] < D[n][end] - 1e-9) end = e; }
    var out = [];
    for(var k=0;k<end;k++) out.push({state:"miss", heard:null});
    var a = n, b = end;
    while(a > 0 || b > 0){
      var o = B[a][b];
      if(o === "diag"){ out[b-1] = {state: tokens[a-1] === expected[b-1] ? "ok" : "bad", heard: tokens[a-1]}; a--; b--; }
      else if(o === "skip"){ out[b-1] = {state:"miss", heard:null}; b--; }
      else { a--; }
    }
    return {cells: out, consumed: end};
  }
  function colorName(id){ for(var i=0;i<COLORS.length;i++) if(COLORS[i].id === id) return COLORS[i].name; return "?"; }

  function copyText(text){
    function fallback(){
      try{
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); ta.remove();
        return Promise.resolve(ok);

    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function(){ return true; }, fallback);
    }catch(e){}
    return fallback();
  }

  // Resultado do Stroop por voz: palavra por palavra (certa / cor errada / não captada) + relatório
  // técnico do que o reconhecedor devolveu, que pode ser copiado e enviado para ajustar o app.
  function stroopVoiceBreakdown(cells, states, heard, log, ctl){
    var wrap = el("div",{class:"voice-breakdown"});
    wrap.appendChild(el("div",{class:"calc-hint", style:"font-weight:600; color:var(--ink);"},["Conferência palavra por palavra"]));
    wrap.appendChild(el("div",{class:"vb-legend"},[
      el("span",{class:"vb-ok"},["cor certa"]), el("span",{class:"vb-bad"},["cor errada"]), el("span",{class:"vb-miss"},["não captada (não conta como erro)"])
    ]));
    var grid = el("div",{class:"vb-grid"});
    var lines = [];
    cells.forEach(function(c, i){
      var st = states[i] || "miss";
      var want = colorName(c.displayColorId);
      var sub = st === "ok" ? "✓" : st === "bad" ? "ouvi " + colorName(heard[i]).toLowerCase() : "não captada";
      grid.appendChild(el("div",{class:"vb-cell " + st},[(i+1) + ". " + want, el("small",{},[sub])]));
      lines.push((i+1) + ". " + want + " → " + (st === "ok" ? "ok" : st === "bad" ? "ouviu " + colorName(heard[i]) : "não captada"));
    });
    wrap.appendChild(grid);

    var okN = states.filter(function(s){ return s === "ok"; }).length;
    var badN = states.filter(function(s){ return s === "bad"; }).length;
    voiceReportBlock(wrap, "Stroop",
      okN + " certas, " + badN + " erradas, " + (cells.length - okN - badN) + " não captadas, de " + cells.length,

  }
  // Botão "Copiar relatório de voz" + relatório técnico (o que o reconhecedor devolveu, com tempos).
  function voiceReportBlock(wrap, title, resultLine, linesTitle, lines, log, ctl){
    var report = [
      "Cronofoco — relatório de voz (" + title + ")",
      "Data: " + new Date().toLocaleString("pt-BR"),
      "Motor de voz: " + ((ctl && ctl.service) || (isNativePlatform() ? "?" : "navegador")),
      "Aparelho: " + navigator.userAgent,
      "Resultado: " + resultLine,
      "",
      linesTitle,
      lines.join("\n"),
      "",
      "O que o reconhecedor devolveu:"

      return "+" + (e.t/1000).toFixed(1) + "s " + (e.s ? "[" + e.s + "] " : "") + e.type + (e.text ? ": " + e.text : "");
    })).join("\n");
    var copyBtn = el("button",{class:"btn secondary", type:"button"},["📋 Copiar relatório de voz"]);

      copyText(report).then(function(ok){
        copyBtn.textContent = ok ? "✓ Copiado — é só colar na conversa" : "Não deu para copiar — veja o texto abaixo";

    });
    wrap.appendChild(el("div",{class:"actions-row", style:"margin-top:12px; justify-content:flex-start;"},[copyBtn]));
    wrap.appendChild(el("details",{},[el("summary",{},["Ver relatório técnico"]), el("pre",{},[report])]));
    return wrap;
  }

  /* ============================= ENTRADA DE VOZ CONTÍNUA =============================
     startVoiceInput() mantém o microfone ouvindo até stop(), e entrega o texto AO VIVO:
       onText(texto, final, alternativas, sessão) — "sessão" muda sempre que o reconhecedor
       recomeça do zero (fim de frase, silêncio, restart()); dentro de uma sessão o texto é acumulado.
       onState("ready"|"speech"|"end"|"started"|"stopped"), onLevel(volume), onError(código, fatal).
     No app Android usa o plugin nativo CronoVoice (motor do Google, resultados parciais, reinício
     automático feito no próprio Android). No navegador usa a Web Speech API em modo contínuo. */
  var _cronoVoice = null;
  function cronoVoicePlugin(){
    if(_cronoVoice) return _cronoVoice;
    try{
      var C = window.Capacitor;
      if(!C || !isNativePlatform()) return null;
      if(C.isPluginAvailable && !C.isPluginAvailable("CronoVoice")) return null;
      _cronoVoice = C.registerPlugin ? C.registerPlugin("CronoVoice") : (C.Plugins && C.Plugins.CronoVoice) || null;
    }catch(e){ _cronoVoice = null; }
    return _cronoVoice;

  function startVoiceInput(h){
    var ctl = {stopped:false, service:null, stop:function(){}, restart:function(){}, log:[]};
    // Registro do que o reconhecedor devolveu (para o "Relatório de voz" no fim do exercício).
    var t0 = Date.now(), lastLogged = {};
    function log(type, s, text){
      if(ctl.log.length > 600) return;

    }
    function emitText(t, fin, alts, s){
      if(ctl.stopped) return;

      if(ctl.stopped) return;

      else if(s === "ready" || s === "end") log(s === "ready" ? "ouvindo" : "pausa", "", "");
      if(h.onState) h.onState(s, info||{});
    }
    function emitError(code, fatal){ if(ctl.stopped) return; log("erro", "", code + (fatal ? " (fatal)" : "")); if(fatal) ctl.stop(); if(h.onError) h.onError(code, fatal); }

    var P = cronoVoicePlugin();
    if(P){
      var handles = [];
      var add = function(ev, fn){
        try{
          Promise.resolve(P.addListener(ev, function(d){ if(!ctl.stopped) fn(d||{}); })).then(function(hd){
            if(ctl.stopped){ try{ hd.remove(); }catch(e){} } else handles.push(hd);
          }).catch(function(){});
        }catch(e){}
      };
      var bestOf = function(m){ return (m && m.length) ? m[0] : ""; };
      add("voicePartial", function(d){ emitText(bestOf(d.matches), false, d.matches, "n"+d.session); });
      add("voiceResult", function(d){ emitText(bestOf(d.matches), true, d.matches, "n"+d.session); });
      add("voiceState", function(d){ emitState(d.state, d); });
      add("voiceLevel", function(d){ if(!ctl.stopped && h.onLevel) h.onLevel(d.rms); });
      add("voiceError", function(d){ emitError(d.code, !!d.fatal); });

      Promise.resolve(perm && perm.requestPermissions ? perm.requestPermissions() : null).then(function(p){
        if(ctl.stopped) return;

        if(!granted){ emitError("not-allowed", true); return; }

        if(ctl._done) return; ctl._done = true; ctl.stopped = true;

      rec.onstart = function(){ if(mine === session) emitState("ready"); };

      rec.onresult = function(ev){
        if(mine !== session) return;
        var parts = [], fin = true;
        for(var i=0;i<ev.results.length;i++){ parts.push(ev.results[i][0].transcript); if(!ev.results[i].isFinal) fin = false; }
        var last = ev.results[ev.results.length-1], prefix = parts.slice(0,-1).join(" "), alts = [];
        for(var k=0;k<last.length;k++) alts.push((prefix ? prefix+" " : "") + last[k].transcript);
        emitText(parts.join(" "), fin, alts, "w"+mine);
      };
      rec.onerror = function(ev){
        if(ev.error === "not-allowed" || ev.error === "service-not-allowed") emitError("not-allowed", true);
        else if(ev.error === "audio-capture") emitError("audio-capture", true);
        else if(ev.error === "network") emitError("network", false);

      try{ rec.start(); }catch(e){ setTimeout(begin, 400); }
    }
    ctl.stop = function(){ ctl.stopped = true; if(rec){ try{ rec.onend = null; rec.abort(); }catch(e){} } };
    ctl.restart = function(){ if(rec && !ctl.stopped){ var r = rec; session++; try{ r.onend = null; r.abort(); }catch(e){} setTimeout(begin, 150); } };
    begin();

  }

  // Painel "Pode falar / Ouvi: ..." com medidor de volume — mostra quando o app está ouvindo

  var NATIVE_NO_MIC_MSG = "Não consegui usar o microfone. Feche outros apps que possam estar usando o microfone (gravador, ligação, assistente) e tente de novo.";

  function makeVoiceStatus(){
    var label = el("span",{class:"vs-label"},["⏳ Ligando o microfone…"]);
    var fill = el("span",{class:"vs-meter-fill"});
    var heard = el("div",{class:"vs-heard"});
    var root = el("div",{class:"voice-status", "data-state":"busy"},[

      state: function(s){
        if(errored) return;

        else if(s === "end" || s === "started"){ root.setAttribute("data-state","busy"); label.textContent = "⏳ Um instante…"; fill.style.width = "0%"; }
      },
      level: function(rms){ var pct = Math.max(0, Math.min(100, ((+rms||0) + 2) / 12 * 100)); fill.style.width = pct + "%"; },

      },
      error: function(code, fatal){

        else if(code === "audio-capture") msg = isNativePlatform() ? NATIVE_NO_MIC_MSG : NO_MIC_MSG;
        else if(code === "language") msg = NATIVE_LANG_MSG;
        else if(code === "network") msg = "⚠️ Sem conexão com a internet? O reconhecimento de voz precisa de internet.";
        else msg = "O reconhecimento de voz parou (" + code + ").";
        if(fatal){ errored = true; root.setAttribute("data-state","error"); label.textContent = msg; }
        else {
          heard.textContent = msg; heard.className = "vs-heard warn";
          if(netTimer) clearTimeout(netTimer);
          netTimer = setTimeout(function(){ if(heard.className.indexOf("warn") !== -1){ heard.textContent = ""; heard.className = "vs-heard"; } }, 4000);
        }
      }
    };
  }

  /* ============================= HISTÓRIA MALUCA (ajuda de memorização) =============================
     Técnica da Associação Ridícula / Método dos Loci: o cérebro grava com facilidade cenas fora do
     comum — por isso os modelos priorizam exagero, ação e imagem vívida (cor, som, movimento). Curtos
     de propósito: uma frase longa demais atrapalha mais do que ajuda, principalmente com poucas
     palavras na lista. Vocabulário bem variado entre os modelos para não soar repetitivo. */
  var STORY_LINKS = [
    "{A} explode e vira {B} numa nuvem de fumaça roxa.",
    "{A} engole {B} inteiro num só gole.",
    "{A} dança break em cima de {B}.",
    "{A} se transforma em {B} com um estalo.",
    "{A} atropela {B} de patins.",
    "{A} derrete e escorre para dentro de {B}.",

  // Sequência "saco embaralhado": consome os modelos em ordem aleatória sem repetir nenhum até
  // esgotar o baralho, e ao reiniciar evita repetir o mesmo modelo bem na emenda entre um ciclo e outro.
  function genStoryTemplateSequence(total){
    var seq = [];
    while(seq.length < total){
      var batch = shuffle(STORY_LINKS.slice());
      if(seq.length && batch[0] === seq[seq.length-1] && batch.length > 1){
        var swapIdx = 1 + rand(batch.length-1);
        var tmp = batch[0]; batch[0] = batch[swapIdx]; batch[swapIdx] = tmp;
      }
      seq = seq.concat(batch);
    }
    return seq.slice(0, total);
  }
  function buildCrazyStory(words){
    var total = words.length - 1;
    if(total <= 0) return "";
    var seq = genStoryTemplateSequence(total);
    var parts = [];
    for(var i=0;i<total;i++){
      parts.push(seq[i].replace("{A}","<b>"+words[i].toUpperCase()+"</b>").replace("{B}","<b>"+words[i+1].toUpperCase()+"</b>"));
    }
    return parts.join(" ");
  }

    try{
      var raw = localStorage.getItem(HISTORY_KEY);
      var h = raw ? JSON.parse(raw) : {};
      ALL_KINDS.forEach(function(k){ if(!h[k]) h[k] = []; });
      return h;
    }catch(e){
      var h2 = {}; ALL_KINDS.forEach(function(k){ h2[k] = []; }); return h2;
    }
  }
  function saveHistory(h){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){}
  }
  function addRecord(kind, rec){
    var h = loadHistory();
    if(!h[kind]) h[kind] = [];
    rec.ts = Date.now();
    h[kind].push(rec);
    if(h[kind].length > 200) h[kind] = h[kind].slice(-200);
    saveHistory(h);
    return h;
  }
  // Permite descartar um resultado já salvo (ex.: sessão interrompida por alguém, tempo/acerto
  // não representativo) sem precisar apagar todo o histórico daquele exercício.
  function discardRecord(kind, ts){
    if(!kind || !ts) return;
    var h = loadHistory();
    h[kind] = (h[kind]||[]).filter(function(r){ return r.ts !== ts; });
    saveHistory(h);
  }

  function medalFor(elapsedMs, thresholds){
    if(elapsedMs <= thresholds.gold) return "ouro";
    if(elapsedMs <= thresholds.silver) return "prata";
    if(elapsedMs <= thresholds.bronze) return "bronze";
    return null;
  }

  // Ranking interno do Cálculo Mental: como o total de contas por sessão agora varia (30 a 200),
  // um "tempo total" só é comparável dentro da mesma quantidade — por isso o critério principal
  // é sempre a quantidade de contas respondidas (mais contas = melhor colocado), e só depois
  // o tempo (ranking de velocidade) ou o acerto (ranking de performance) desempatam.
  function calcLeaderboards(){
    var list = (loadHistory().calc || []).filter(function(r){ return r.total > 0; });
    var byTime = list.slice().sort(function(a,b){
      if(b.total !== a.total) return b.total - a.total;
      return a.elapsedMs - b.elapsedMs;
    }).slice(0,20);
    var byAcc = list.slice().sort(function(a,b){
      if(b.total !== a.total) return b.total - a.total;
      if(b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
      return a.elapsedMs - b.elapsedMs;
    }).slice(0,20);
    return {byTime:byTime, byAcc:byAcc};
  }

    var h = loadHistory();

    if(!list.length) return el("span",{class:"last-chip"},["Ainda sem sessões"]);

      parts.push((r.solved? "Concluído" : "Sem concluir") + " em " + fmtTime(r.elapsedMs));

      parts.push("Última: " + fmtTime(r.elapsedMs));
    } else if(kind === "digitspan"){
      parts.push("Span " + r.span + " (" + (r.mode==="backward"?"inverso":"direto") + ")");
    } else if(kind === "pairs"){
      parts.push(r.pairs + " pares em " + fmtTime(r.elapsedMs));
    } else if(kind === "flashcards"){
      parts.push((r.deckLabel||"Baralho") + " · " + r.accuracy + "% (" + r.total + " cartões)");
    } else if(kind === "reading"){
      parts.push(r.correct + "/" + r.total + " (" + r.accuracy + "%)");

      parts.push(r.count + " palavras válidas em " + r.duration + "s (" + r.category + ")");

      parts.push(r.accuracy + "% (" + r.n + "-back)");
    } else if(kind === "recall"){
      parts.push(r.correct + "/" + r.total + " (" + r.accuracy + "%)");
    } else if(kind === "timeperception"){
      parts.push("Erro médio: " + r.avgErrorPct + "% (" + r.rounds + " rodadas)");
    } else if(kind === "symbolsearch"){
      parts.push(r.accuracy + "% em " + fmtTime(r.elapsedMs));
    } else if(kind === "calibration"){
      parts.push(r.hits + "/" + r.total + " na faixa (" + r.accuracy + "%)");
    } else {
      parts.push(r.accuracy + "% em " + fmtTime(r.elapsedMs));
    }
    return el("span",{class:"last-chip"}, parts);
  }

  function computeStreak(){
    var h = loadHistory();
    var days = {};
    ALL_KINDS.forEach(function(k){
      (h[k]||[]).forEach(function(r){
        var d = new Date(r.ts); d.setHours(0,0,0,0);
        days[d.getTime()] = true;
      });
    });
    var streak = 0;
    var cursor = new Date(); cursor.setHours(0,0,0,0);
    while(days[cursor.getTime()]){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }
    return streak;
  }

  /* ============================= CALC ============================= */
  function buildCalcQuestions(total){
    var ops = genOperatorSequence(total);
    var qs = [];
    for(var i=0;i<total;i++){
      var a = rand(11), b = rand(11), op = ops[i];
      if(op === "-" && a < b){ var t=a; a=b; b=t; }
      var raw = op === "+" ? a+b : op === "-" ? a-b : a*b;
      qs.push({a:a, b:b, op:op, answer:raw});
    }
    return qs;
  }

  var CALC_TOTALS = [30, 50, 100, 150, 200];
  function renderCalc(root){
    var TOTAL = 100;
    var idx, correct, startTime, timerHandle, questions, log, mode, recognizer, voiceRunning, questionStartTs, voiceCtl = null, voiceStatus = null, voiceLogRef = null;

    showIntro();

      // Escolha do teclado, só relevante no modo Digitar: "do app" é o próprio app desenhando
      // os números na tela (funciona igual em qualquer celular, inclusive iPhone e navegadores
      // embutidos tipo WhatsApp); "do celular" usa o teclado nativo do aparelho.
      var kbWrap = el("div",{style:"margin-top:14px;"});
      var kbLabel = el("p",{class:"calc-hint", style:"margin-bottom:8px;"},["Teclado (modo Digitar):"]);
      var kbPicker = el("div",{class:"mode-picker"});
      var kbAppBtn = el("button",{class:"mode-btn", type:"button", "aria-pressed": typeKeyboardMode==="app"?"true":"false", onclick:function(){ selectKb("app"); }},["🔢 Teclado do app (na tela)"]);
      var kbNativeBtn = el("button",{class:"mode-btn", type:"button", "aria-pressed": typeKeyboardMode==="native"?"true":"false", onclick:function(){ selectKb("native"); }},["⌨ Teclado do dispositivo"]);

      function selectKb(k){
        typeKeyboardMode = k;

      }
      function select(m){

      }
      var hintEl = el("p",{class:"calc-hint"},["Contas com números inteiros de 0 a 10, em sequência — sem voltar atrás. Como você quer responder?"]);
      body.appendChild(hintEl);

      if(!voiceOk && speechSupported() && inIframe()){
        body.appendChild(el("p",{class:"calc-hint", style:"color:var(--gold);"},["🎙 Modo voz " + voiceUnavailableReason() + "."]));
      }
      body.appendChild(modePicker);
      body.appendChild(kbWrap);
      var startBtn = el("button",{class:"btn"},["Começar"]);
      startBtn.addEventListener("click", function(){
        if(chosenMode === "voice"){

    function start(chosenMode){
      idx = 0; correct = 0; log = [];
      questions = buildCalcQuestions(TOTAL);
      mode = chosenMode;
      startTime = Date.now();
      if(timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(tick, 250);
      controlsRow.style.display = "";
      body.innerHTML = "";
      typeSkeletonReady = false;
      if(mode === "voice"){
        body.appendChild(el("div",{class:"voice-banner"},["🎙 Modo voz: fale só o resultado de cada conta (ex.: \"quarenta e dois\"), sem ler a conta. A resposta é registrada na hora e você já passa para a próxima — não dá para corrigir. O histórico abaixo mostra só se acertou (✓) ou errou (✗), sem revelar o número certo."]));
      }
      var layout = el("div",{class:"calc-layout"},[
        el("div",{class:"calc-main"},[el("div",{id:"calcQuestionArea"})]),
        el("div",{class:"calc-side"},[el("div",{id:"calcLedgerArea"})])
      ]);
      body.appendChild(layout);
      renderLedger();
      if(mode === "voice"){ startCalcVoice(); renderQuestionVoice(); } else renderQuestionType();
    }

    function restart(){ stopVoice(); start(mode || "type"); }

    // Volta para a tela de configuração sem salvar nada — para quando a pessoa quer
    // mudar a quantidade de contas ou o modo, ou simplesmente não quer terminar agora.
    function giveUp(){ if(timerHandle) clearInterval(timerHandle); stopVoice(); showIntro(); }

    function tick(){ timerEl.textContent = fmtTime(Date.now()-startTime); }

    function renderUpcoming(){
      var area = $("#calcUpcomingArea", body);
      if(!area) return;
      area.innerHTML = "";
      // Só as 2 próximas (antes eram até 4) — e a caixa sempre mostra os mesmos 2 "slots",
      // com placeholder invisível quando faltam menos de 2 contas pro fim. Sem isso, a caixa
      // ia encolhendo perto do fim da sessão (3ª/4ª conta some primeiro), e como o teclado
      // fica logo abaixo dela, ele "subia" a cada conta faltando. Agora a altura da caixa
      // fica igual do início ao fim, então o teclado nunca se move.
      var next = questions.slice(idx+1, idx+3);
      area.appendChild(el("span",{class:"side-label", style:"margin-bottom:0;"},["Próximas"]));
      var col = el("div",{class:"upcoming-col"});

        if(next[i]){
