          ["Categoria", category],
          ["Tempo", chosenDuration+"s"],
          ["Válidas / Digitadas", count + " / " + wordsList.length]
        ],
        extra: wordsList.length ? el("div",{},[
          el("div",{class:"calc-hint"},["Palavras que você escreveu (riscadas = fora da lista da categoria):"]),
          el("div",{class:"chip-list"}, wordsList.map(function(w){ return el("span",{class:"chip"+(w.valid?"":" chip-invalid")},[w.text + (w.valid?"":" ✕")]); }))
        ]) : null,
        kind:"fluency", ts:rec.ts, onRepeat:start
      });
    }

    return function cleanup(){ if(countdownHandle) clearInterval(countdownHandle); };
  }

  /* ============================= CÁLCULO EM CADEIA ============================= */
  function renderChainCalc(root){
    var STEP_COUNTS = [4, 6, 8];
    var ROUND_COUNTS = [5, 10, 15, 20];
    var stepsPerRound = 6;
    var totalRounds = 10;
    var mode = "simples";

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[
      el("h2",{},["Cálculo em Cadeia"]),
      el("div",{class:"timer mono"},["00:00"])
    ]);
    var timerEl = head.querySelector(".timer");
    var controlsRow = el("div",{class:"actions-row", style:"display:none; margin-bottom:14px; justify-content:flex-start;"},[
      el("button",{class:"btn secondary", onclick:function(){ finish(); }},["Parar"]),
      el("button",{class:"btn ghost", onclick:function(){ restart(); }},["Reiniciar"]),
      el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"])
    ]);
    var body = el("div",{class:"calc-body"});
    panel.appendChild(head);
    panel.appendChild(controlsRow);
    panel.appendChild(body);
    root.appendChild(panel);

    var round, correct, answered, startTime, timerHandle, revealTimer, currentAnswer;

    showIntro();

    function showIntro(){
      body.innerHTML = "";
      controlsRow.style.display = "none";
      timerEl.textContent = "00:00";
      var chosenMode = "simples";
      var modePicker = el("div",{class:"mode-picker"});
      var simplesBtn = el("button",{class:"mode-btn", type:"button", "aria-pressed":"true", onclick:function(){ selectMode("simples"); }},["Simples (+ e −)"]);
      var avancadoBtn = el("button",{class:"mode-btn", type:"button", "aria-pressed":"false", onclick:function(){ selectMode("avancado"); }},["Avançado (+ − × 2 × 3)"]);
      modePicker.appendChild(simplesBtn); modePicker.appendChild(avancadoBtn);
      function selectMode(m){
        chosenMode = m;
        simplesBtn.setAttribute("aria-pressed", m==="simples"?"true":"false");
        avancadoBtn.setAttribute("aria-pressed", m==="avancado"?"true":"false");
      }
      var stepPicker = el("div",{class:"duration-picker"});
      STEP_COUNTS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===stepsPerRound?"true":"false", onclick:function(){
          stepsPerRound = n;
          $all("button", stepPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" passos"]);
        stepPicker.appendChild(b);
      });
      var roundPicker = el("div",{class:"duration-picker"});
      ROUND_COUNTS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===totalRounds?"true":"false", onclick:function(){
          totalRounds = n;
          $all("button", roundPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" rodadas"]);
        roundPicker.appendChild(b);
      });
      body.appendChild(el("p",{class:"calc-hint"},["Um número inicial aparece, depois uma sequência de contas surge uma de cada vez. Some (ou subtraia/multiplique) tudo de cabeça, sem anotar nada, e digite só o resultado final de cada rodada."]));
      body.appendChild(modePicker);
      body.appendChild(el("div",{style:"margin-top:14px;"},[stepPicker]));
      body.appendChild(roundPicker);
      body.appendChild(el("div",{class:"story-box"},[
        el("div",{},["Exemplo: começa em ", el("b",{},["10"]), ", aparece ", el("b",{},["+ 5"]), " (vira 15), depois ", el("b",{},["− 3"]), " (vira 12) → você digitaria ", el("b",{},["12"]), "."])
      ]));
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:8px;"},[
        el("button",{class:"btn", onclick:function(){ start(chosenMode); }},["Começar"])
      ]));
    }

    function genChain(length, m){
      var total = 10 + rand(21);
      var startNum = total;
      var stepLabels = [];
      var pool = m === "avancado" ? ["+","-","x2","x3"] : ["+","-"];
      var bag = [];
      for(var i=0;i<length;i++){
        if(!bag.length) bag = shuffle(pool);
        var op = bag.pop();
        var operand;
        if(op === "+"){
          operand = 1+rand(9); total += operand; stepLabels.push("+ " + operand);
        } else if(op === "-"){
          if(total < 2){ operand = 1+rand(9); total += operand; stepLabels.push("+ " + operand); }
          else { operand = 1 + rand(Math.min(9, total)); total -= operand; stepLabels.push("− " + operand); }
        } else if(op === "x2"){
          if(total*2 > 300 || total === 0){ operand = 1+rand(9); total += operand; stepLabels.push("+ " + operand); }
          else { total *= 2; stepLabels.push("× 2"); }
        } else {
          if(total*3 > 300 || total === 0){ operand = 1+rand(9); total += operand; stepLabels.push("+ " + operand); }
          else { total *= 3; stepLabels.push("× 3"); }
        }
      }
      return {startNum:startNum, steps:stepLabels, answer:total};
    }

    function start(chosenMode){
      mode = chosenMode;
      round = 1; correct = 0; answered = 0;
      startTime = Date.now();
      if(timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(tick, 250);
      controlsRow.style.display = "";
      nextRound();
    }

    function restart(){ clearRevealTimer(); start(mode); }

    // Volta para a tela de configuração sem salvar nada.
    function giveUp(){ clearRevealTimer(); if(timerHandle) clearInterval(timerHandle); showIntro(); }

    function tick(){ timerEl.textContent = fmtTime(Date.now()-startTime); }

    function clearRevealTimer(){ if(revealTimer){ clearTimeout(revealTimer); revealTimer = null; } }

    function nextRound(){
      var chain = genChain(stepsPerRound, mode);
      currentAnswer = chain.answer;
      body.innerHTML = "";
      var stageInfo = el("p",{class:"calc-hint"},["Rodada " + round + " de " + totalRounds]);
      var numEl = el("div",{class:"chain-num mono"},[String(chain.startNum)]);
      body.appendChild(stageInfo);
      body.appendChild(numEl);
      var stepIdx = 0;
      revealTimer = setTimeout(function(){
        numEl.textContent = "";
        numEl.className = "chain-step mono";
        revealTimer = setTimeout(showStep, 300);
      }, 1100);
      function showStep(){
        if(stepIdx >= chain.steps.length){
          numEl.textContent = "";
          revealTimer = setTimeout(showInput, 300);
          return;
        }
        numEl.textContent = chain.steps[stepIdx];
        stepIdx++;
        revealTimer = setTimeout(function(){
          numEl.textContent = "";
          revealTimer = setTimeout(showStep, 250);
        }, 950);
      }
      function showInput(){
        body.innerHTML = "";
        body.appendChild(stageInfo);
        var input = el("input",{class:"calc-input", type:"text", inputmode:"numeric", autocomplete:"off"});
        body.appendChild(input);
        body.appendChild(el("p",{class:"calc-hint"},["Qual é o total final?"]));
        body.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[
          el("button",{class:"btn", onclick:submit},["Confirmar"])
        ]));
        input.focus();
        input.addEventListener("keydown", function(ev){ if(ev.key === "Enter") submit(); });
        function submit(){
          var raw = (input.value||"").replace(/[^\d-]/g,"");
          var val = parseInt(raw, 10);
          answered++;
          if(val === currentAnswer) correct++;
          if(round < totalRounds){
            round++;
            nextRound();
          } else {
            finish();
          }
        }
      }
    }

    function finish(){
      clearRevealTimer();
      clearInterval(timerHandle);
      body.innerHTML = "";
      controlsRow.style.display = "none";
      var elapsedMs = Date.now()-startTime;
      var accuracy = answered ? Math.round(correct/answered*100) : 0;
      var rec = {correct:correct, total:answered, accuracy:accuracy, mode:mode, steps:stepsPerRound, elapsedMs:elapsedMs};
      addRecord("chaincalc", rec);
      showResult(panel, {
        big: correct + " / " + answered,
        metrics: [
          ["Acerto", accuracy+"%"],
          ["Modo", mode==="avancado" ? "Avançado" : "Simples"],
          ["Tempo total", fmtTime(elapsedMs)]
        ],
        kind:"chaincalc", ts:rec.ts, onRepeat:restart
      });
    }

    return function cleanup(){ clearRevealTimer(); if(timerHandle) clearInterval(timerHandle); };
  }

  /* ============================= N-BACK ============================= */
  function renderNBack(root){
    var N_OPTIONS = [1, 2];
    var LENGTH_OPTIONS = [16, 20, 24];
    var nVal = 1;
    var seqLength = 20;
    var STIM_MS = 1900, GAP_MS = 350;

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[
      el("h2",{},["N-Back"]),
      el("div",{class:"timer mono"},["00:00"])
    ]);
    var timerEl = head.querySelector(".timer");
    var controlsRow = el("div",{class:"actions-row", style:"display:none; margin-bottom:14px; justify-content:flex-start;"},[
      el("button",{class:"btn secondary", onclick:function(){ finish(); }},["Parar"]),
      el("button",{class:"btn ghost", onclick:function(){ restart(); }},["Reiniciar"]),
      el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"])
    ]);
    var body = el("div",{class:"calc-body"});
    panel.appendChild(head);
    panel.appendChild(controlsRow);
    panel.appendChild(body);
    root.appendChild(panel);

    var sequence, pressed, startTime, timerHandle, trialTimer, gapTimer, curIdx;
    var hits, misses, falseAlarms, correctRejections, responseWindow, keyHandler;

    showIntro();

    function showIntro(){
      body.innerHTML = "";
      controlsRow.style.display = "none";
      timerEl.textContent = "00:00";
      var nPicker = el("div",{class:"mode-picker"});
      var nBtns = [];
      N_OPTIONS.forEach(function(n){
        var b = el("button",{class:"mode-btn", type:"button", "aria-pressed": n===nVal?"true":"false", onclick:function(){
          nVal = n;
          nBtns.forEach(function(bb){ bb.setAttribute("aria-pressed", bb===b?"true":"false"); });
        }},[n+"-back"]);
        nBtns.push(b);
        nPicker.appendChild(b);
      });
      var lenPicker = el("div",{class:"duration-picker"});
      LENGTH_OPTIONS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===seqLength?"true":"false", onclick:function(){
          seqLength = n;
          $all("button", lenPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" letras"]);
        lenPicker.appendChild(b);
      });
      body.appendChild(el("p",{class:"calc-hint"},["Uma letra aparece por vez. Aperte o botão (ou a barra de espaço) sempre que a letra atual for igual à que apareceu N posições atrás. Se for diferente, não aperte nada."]));
      body.appendChild(nPicker);
      body.appendChild(el("div",{style:"margin-top:14px;"},[lenPicker]));
      body.appendChild(el("div",{class:"story-box"},[
        el("div",{},["Exemplo com 1-back: aparece ", el("b",{},["B"]), ", depois aparece ", el("b",{},["B"]), " de novo → aperte o botão (é igual à anterior). Depois aparece ", el("b",{},["K"]), " → não aperte (é diferente)."])
      ]));
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:8px;"},[
        el("button",{class:"btn", onclick:start},["Começar"])
      ]));
    }

    function genSequence(n, length){
      var seq = [];
      for(var i=0;i<length;i++){
        var candidate;
        if(i>=n && Math.random() < 0.35){
          candidate = seq[i-n];
        } else {
          candidate = NBACK_LETTERS[rand(NBACK_LETTERS.length)];
        }
        seq.push(candidate);
      }
      return seq;
    }

    function start(){
      sequence = genSequence(nVal, seqLength);
      pressed = {};
      hits = 0; misses = 0; falseAlarms = 0; correctRejections = 0;
      startTime = Date.now();
      if(timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(tick, 250);
      controlsRow.style.display = "";
      body.innerHTML = "";
      var progress = el("div",{class:"nback-progress"},[""]);
      var stimEl = el("div",{class:"nback-stim mono"},[""]);
      var btn = el("button",{type:"button", class:"nback-btn", onclick:handlePress},["É igual!"]);
      var feedback = el("div",{class:"nback-feedback"},[""]);
      body.appendChild(progress);
      body.appendChild(stimEl);
      body.appendChild(btn);
      body.appendChild(feedback);
      keyHandler = function(ev){
        if(ev.code === "Space" || ev.key === " "){ ev.preventDefault(); handlePress(); }
      };
      document.addEventListener("keydown", keyHandler);
      showTrial(0, progress, stimEl, feedback);
    }

    function restart(){
      clearTimers();
      if(timerHandle) clearInterval(timerHandle);
      if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
      start();
    }

    // Volta para a tela de configuração sem salvar nada.
    function giveUp(){
      clearTimers();
      if(timerHandle) clearInterval(timerHandle);
      if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
      showIntro();
    }

    function tick(){ timerEl.textContent = fmtTime(Date.now()-startTime); }

    function clearTimers(){
      if(trialTimer){ clearTimeout(trialTimer); trialTimer = null; }
      if(gapTimer){ clearTimeout(gapTimer); gapTimer = null; }
    }

    function handlePress(){
      if(!responseWindow || pressed[curIdx]) return;
      pressed[curIdx] = true;
    }

    function showTrial(i, progress, stimEl, feedback){
      curIdx = i;
      responseWindow = true;
      progress.textContent = "Letra " + (i+1) + " de " + sequence.length;
      stimEl.textContent = sequence[i];
      feedback.textContent = "";
      trialTimer = setTimeout(function(){
        responseWindow = false;
        evaluateTrial(i, feedback);
        stimEl.textContent = "";
        gapTimer = setTimeout(function(){
          if(i+1 < sequence.length) showTrial(i+1, progress, stimEl, feedback);
          else finish();
        }, GAP_MS);
      }, STIM_MS);
    }

    function evaluateTrial(i, feedback){
      var isMatch = i >= nVal && sequence[i] === sequence[i-nVal];
      var didPress = !!pressed[i];
      if(isMatch && didPress){ hits++; feedback.textContent = "✔ Acertou — era igual"; }
      else if(isMatch && !didPress){ misses++; feedback.textContent = "— Era igual, mas não apertou"; }
      else if(!isMatch && didPress){ falseAlarms++; feedback.textContent = "✖ Apertou, mas era diferente"; }
      else { correctRejections++; feedback.textContent = ""; }
    }

    function finish(){
      clearTimers();
      clearInterval(timerHandle);
      if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
      body.innerHTML = "";
      controlsRow.style.display = "none";
      var elapsedMs = Date.now()-startTime;
      var evaluable = hits+misses+falseAlarms+correctRejections;
      var accuracy = evaluable ? Math.round((hits+correctRejections)/evaluable*100) : 0;
      var rec = {n:nVal, length:seqLength, hits:hits, misses:misses, falseAlarms:falseAlarms, correctRejections:correctRejections, accuracy:accuracy, elapsedMs:elapsedMs};
      addRecord("nback", rec);
      showResult(panel, {
        big: accuracy + "%",
        metrics: [
          ["N-back", nVal+"-back"],
          ["Acertos", String(hits)],
          ["Alarmes falsos", String(falseAlarms)],
          ["Tempo total", fmtTime(elapsedMs)]
        ],
        kind:"nback", ts:rec.ts, onRepeat:restart
      });
    }

    return function cleanup(){
      clearTimers();
      if(timerHandle) clearInterval(timerHandle);
      if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
    };
  }

  /* ============================= RECALL TARDIO ============================= */
  function renderRecall(root){
    var WORD_COUNTS = [8, 10, 12, 15, 20, 24, 30];
    var VIEW_DURATIONS = [10, 15, 20, 30, 45, 60];
    var DISTRACTOR_COUNT = 8;
    var wordCount = 10;
    var viewSeconds = 45;
    var countdownHandle = null;
    var startTime, currentWords;

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[el("h2",{},["Recall Tardio"])]);
    panel.appendChild(head);
    root.appendChild(panel);

    function clearPanelChildren(){ while(panel.children.length>1) panel.removeChild(panel.lastChild); }

    showIntro();

    function showIntro(){
      clearPanelChildren();
      var hint = el("p",{class:"calc-hint"},["Memorize uma lista de palavras, depois resolva algumas continhas rápidas para \"distrair\" a mente — e só então tente lembrar as palavras, sem consultar."]);
      var wordPicker = el("div",{class:"duration-picker"});
      WORD_COUNTS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===wordCount?"true":"false", onclick:function(){
          wordCount = n;
          $all("button", wordPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" palavras"]);
        wordPicker.appendChild(b);
      });
      var durPicker = el("div",{class:"duration-picker"});
      VIEW_DURATIONS.forEach(function(d){
        var b = el("button",{"aria-pressed": d===viewSeconds?"true":"false", onclick:function(){
          viewSeconds = d;
          $all("button", durPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[d+"s"]);
        durPicker.appendChild(b);
      });
      panel.appendChild(hint);
      panel.appendChild(wordPicker);
      panel.appendChild(durPicker);
      panel.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:start},["Começar"])
      ]));
    }

    function start(){
      clearPanelChildren();
      startTime = Date.now();
      currentWords = pickN(WORDS, wordCount);
      var timerEl = el("div",{class:"memo-count mono"},[String(viewSeconds)]);
      panel.appendChild(timerEl);
      var wordGrid = el("div",{class:"word-grid"});
      currentWords.forEach(function(w){ wordGrid.appendChild(el("div",{class:"word-tile"},[w])); });
      panel.appendChild(wordGrid);
      panel.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[
        el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"])
      ]));
      var remaining = viewSeconds;
      countdownHandle = setInterval(function(){
        remaining--;
        timerEl.textContent = String(Math.max(remaining,0));
        if(remaining <= 0){
          clearInterval(countdownHandle);
          distractorStage(0, {correct:0});
        }
      }, 1000);
    }

    function distractorStage(idx, stats){
      clearPanelChildren();
      if(idx >= DISTRACTOR_COUNT){
        recallStage(stats);
        return;
      }
      var a = 2+rand(18), b = 2+rand(18);
      var op = Math.random() < 0.5 ? "+" : "-";
      if(op === "-" && b > a){ var t=a; a=b; b=t; }
      var answer = op === "+" ? a+b : a-b;
      panel.appendChild(el("p",{class:"calc-hint"},["Tarefa de distração — conta " + (idx+1) + " de " + DISTRACTOR_COUNT + ". Responda rápido, sem pensar nas palavras."]));
      panel.appendChild(el("div",{class:"distractor-expr mono"},[a + " " + op + " " + b + " ="]));
      var input = el("input",{class:"calc-input", type:"text", inputmode:"numeric", autocomplete:"off"});
      panel.appendChild(el("div",{class:"actions-row"},[input]));
      panel.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[
        el("button",{class:"btn", onclick:submit},["Confirmar"])
      ]));
      panel.appendChild(el("div",{class:"actions-row", style:"margin-top:10px;"},[
        el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"])
      ]));
      input.focus();
      input.addEventListener("keydown", function(ev){ if(ev.key === "Enter") submit(); });
      function submit(){
        var val = parseInt((input.value||"").replace(/[^\d-]/g,""), 10);
        if(val === answer) stats.correct++;
        distractorStage(idx+1, stats);
      }
    }

    function recallStage(stats){
      clearPanelChildren();
      var recallStart = Date.now();
      var p = el("p",{class:"calc-hint"},["Agora escreva as palavras que você memorizou, sem olhar de novo. Não precisa acertar a ordem."]);
      var fields = el("div",{class:"recall-fields"});
      var inputs = [];
      for(var i=0;i<currentWords.length;i++){
        var inp = el("input",{class:"recall-field", type:"text", autocomplete:"off"});
        inputs.push(inp);
        fields.appendChild(inp);
      }
      function recompute(){
        var targetNorm = currentWords.map(normWord);
        var consumed = {};
        inputs.forEach(function(inp){
          inp.classList.remove("field-correct","field-wrong","field-dup");
          var v = normWord(inp.value);
          if(!v) return;
          var idx = targetNorm.indexOf(v);
          if(idx !== -1 && !consumed[v]){ consumed[v] = true; inp.classList.add("field-correct"); }
          else if(idx !== -1 && consumed[v]){ inp.classList.add("field-dup"); }
          else { inp.classList.add("field-wrong"); }
        });
      }
      fields.addEventListener("input", recompute);
      fields.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){
          ev.preventDefault();
          var idx = inputs.indexOf(ev.target);
          if(idx > -1 && idx < inputs.length-1) inputs[idx+1].focus();
        }
      });
      var submitBtn = el("button",{class:"btn", onclick:function(){ finish(inputs, recallStart, stats); }},["Concluir"]);
      var giveUpBtn = el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"]);
      panel.appendChild(p);
      panel.appendChild(fields);
      panel.appendChild(el("div",{class:"actions-row"},[submitBtn, giveUpBtn]));
      inputs[0].focus();
    }

    // Volta para a tela de configuração sem salvar nada.
    function giveUp(){ if(countdownHandle) clearInterval(countdownHandle); showIntro(); }

    function finish(inputs, recallStart, stats){
      var elapsedMs = Date.now()-recallStart;
      var targetNorm = currentWords.map(normWord);
      var consumed = {};
      inputs.forEach(function(inp){
        var v = normWord(inp.value);
        if(v && targetNorm.indexOf(v) !== -1 && !consumed[v]) consumed[v] = true;
      });
      var hitsCount = Object.keys(consumed).length;
      var missed = currentWords.filter(function(w){ return !consumed[normWord(w)]; });
      var accuracy = Math.round(hitsCount/currentWords.length*100);
      var totalElapsedMs = Date.now()-startTime;
      var rec = {correct:hitsCount, total:currentWords.length, accuracy:accuracy, distractorCorrect:stats.correct, distractorTotal:DISTRACTOR_COUNT, viewSeconds:viewSeconds, elapsedMs:totalElapsedMs};
      addRecord("recall", rec);
      clearPanelChildren();
      showResult(panel, {
        big: hitsCount + " / " + currentWords.length,
        metrics: [
          ["Acerto", accuracy+"%"],
          ["Distração", stats.correct+"/"+DISTRACTOR_COUNT],
          ["Tempo p/ lembrar", fmtTime(elapsedMs)]
        ],
        extra: missed.length ? el("div",{},[
          el("div",{class:"calc-hint"},["Não lembradas:"]),
          el("div",{class:"missed-list"}, missed.map(function(w){ return el("span",{},[w]); }))
        ]) : null,
        kind:"recall", ts:rec.ts, onRepeat:start
      });
    }

    return function cleanup(){ if(countdownHandle) clearInterval(countdownHandle); };
  }

  /* ============================= PERCEPÇÃO DE TEMPO =============================
     Inspirado na pesquisa de David Eagleman sobre percepção do tempo: sem relógio
     visível, sem contar em voz alta, o usuário tenta "sentir" quando um intervalo-alvo
     passou. Mede o erro percentual entre o tempo-alvo e o tempo realmente marcado. */
  function renderTimePerception(root){
    var ROUND_OPTIONS = [3, 5, 7];
    var totalRounds = 5;

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[ el("h2",{},["Percepção de Tempo"]) ]);
    var body = el("div",{});
    panel.appendChild(head);
    panel.appendChild(body);
    root.appendChild(panel);

    var round, results, target, startTs, pulseHandle;

    showIntro();

    function showIntro(){
      body.innerHTML = "";
      var roundPicker = el("div",{class:"duration-picker"});
      ROUND_OPTIONS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===totalRounds?"true":"false", onclick:function(){
          totalRounds = n;
          $all("button", roundPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" rodadas"]);
        roundPicker.appendChild(b);
      });
      body.appendChild(el("p",{class:"calc-hint"},["Um tempo-alvo aparece na tela. Toque em \"Iniciar\", espere sem contar em voz alta e sem olhar outro relógio, e toque em \"Marcar agora\" quando achar que o tempo passou."]));
      body.appendChild(roundPicker);
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:18px;"},[
        el("button",{class:"btn", onclick:start},["Começar"])
      ]));
    }

    function start(){
      round = 1; results = [];
      nextRound();
    }

    function nextRound(){
      target = 8 + rand(33); // 8 a 40 segundos
      body.innerHTML = "";
      body.appendChild(el("p",{class:"calc-hint"},["Rodada " + round + " de " + totalRounds]));
      body.appendChild(el("div",{class:"time-target"},["Alvo: " + target + " segundos"]));
      body.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:runRound},["Iniciar"])
      ]));
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:10px;"},[
        el("button",{class:"btn ghost", onclick:function(){ showIntro(); }},["Desistir"])
      ]));
    }

    function runRound(){
      body.innerHTML = "";
      body.appendChild(el("p",{class:"calc-hint"},["Rodada " + round + " de " + totalRounds]));
      body.appendChild(el("div",{class:"time-wait"},[
        el("div",{class:"time-pulse"}),
        el("div",{class:"center-note"},["Sentindo o tempo passar…"])
      ]));
      body.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:markNow},["Marcar agora"])
      ]));
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:10px;"},[
        el("button",{class:"btn ghost", onclick:function(){ showIntro(); }},["Desistir"])
      ]));
      startTs = Date.now();
    }

    function markNow(){
      var actual = (Date.now()-startTs)/1000;
      var errorPct = Math.abs(actual-target)/target*100;
      results.push({target:target, actual:actual, errorPct:errorPct});
      body.innerHTML = "";
      body.appendChild(el("div",{class:"time-round-result"},[
        el("div",{},["Alvo: " + target + "s · Você marcou em: " + actual.toFixed(1) + "s"]),
        el("div",{class:"diff"},[(actual>target?"+":"") + (actual-target).toFixed(1) + "s (" + Math.round(errorPct) + "% de erro)"])
      ]));
      body.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:function(){
          if(round < totalRounds){ round++; nextRound(); } else { finish(); }
        }},[round < totalRounds ? "Próxima rodada" : "Ver resultado"])
      ]));
    }

    function finish(){
      var avgErrorPct = Math.round(results.reduce(function(s,r){ return s+r.errorPct; },0)/results.length);
      var totalElapsedMs = results.reduce(function(s,r){ return s+r.actual*1000; },0);
      var rec = {rounds:totalRounds, avgErrorPct:avgErrorPct, elapsedMs:totalElapsedMs};
      addRecord("timeperception", rec);
      body.innerHTML = "";
      showResult(panel, {
        big: avgErrorPct + "% de erro",
        metrics: [
          ["Rodadas", String(totalRounds)],
          ["Erro médio", avgErrorPct+"%"],
          ["Tempo total sentido", fmtTime(totalElapsedMs)]
        ],
        kind:"timeperception", ts:rec.ts, onRepeat:start
      });
    }

    return function cleanup(){ if(pulseHandle) clearTimeout(pulseHandle); };
  }

  /* ============================= BUSCA DE SÍMBOLOS =============================
     Inspirado no método da Arrowsmith-Young: exercícios direcionados de discriminação
     visual e atenção seletiva. Cancelamento de caractere-alvo entre distratores parecidos
     (b/d/p/q, 6/9/8/0, M/W/N, E/F/3) — clássico de avaliação neuropsicológica de atenção. */
  function renderSymbolSearch(root){
    var GROUPS = [
      {target:"b", pool:["b","d","p","q"]},
      {target:"p", pool:["p","b","d","q"]},
      {target:"d", pool:["d","b","p","q"]},
      {target:"q", pool:["q","b","d","p"]},
      {target:"6", pool:["6","9","8","0"]},
      {target:"9", pool:["9","6","8","0"]},
      {target:"M", pool:["M","W","N"]},
      {target:"E", pool:["E","F","3"]}
    ];
    var DIFFS = {
      facil:  {label:"Fácil",  cols:6, rows:6, targets:6},
      medio:  {label:"Médio",  cols:8, rows:7, targets:10},
      dificil:{label:"Difícil",cols:9, rows:9, targets:15}
    };
    var diffKey = "medio";
    var totalRounds = 3;

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[
      el("h2",{},["Busca de Símbolos"]),
      el("div",{class:"timer mono"},["00:00"])
    ]);
    var timerEl = head.querySelector(".timer");
    var body = el("div",{});
    panel.appendChild(head);
    panel.appendChild(body);
    root.appendChild(panel);

    var round, foundCount, targetCount, falseClicks, correctClicks, startTime, timerHandle, roundStartMs;

    showIntro();

    function showIntro(){
      timerEl.textContent = "00:00";
      body.innerHTML = "";
      var diffPicker = el("div",{class:"mode-picker"});
      Object.keys(DIFFS).forEach(function(k){
        var b = el("button",{class:"mode-btn", "aria-pressed": k===diffKey?"true":"false", onclick:function(){
          diffKey = k;
          $all("button", diffPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn.dataset.k===diffKey?"true":"false"); });
        }, "data-k":k},[DIFFS[k].label]);
        diffPicker.appendChild(b);
      });
      body.appendChild(el("p",{class:"calc-hint"},["Uma letra-alvo aparece no topo. Encontre e toque em todas as ocorrências dela na grade, o mais rápido possível — evite tocar nas parecidas."]));
      body.appendChild(diffPicker);
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:18px;"},[
        el("button",{class:"btn", onclick:start},["Começar"])
      ]));
    }

    function start(){
      round = 1; falseClicks = 0; correctClicks = 0;
      startTime = Date.now();
      timerHandle = setInterval(function(){ timerEl.textContent = fmtTime(Date.now()-startTime); }, 250);
      nextRound();
    }

    function nextRound(){
      var diff = DIFFS[diffKey];
      var group = GROUPS[rand(GROUPS.length)];
      targetCount = Math.min(diff.targets, Math.floor(diff.cols*diff.rows*0.28));
      foundCount = 0;
      roundStartMs = Date.now();
      var totalCells = diff.cols*diff.rows;
      var cellChars = [];
      for(var i=0;i<totalCells;i++) cellChars.push(null);
      var idxPool = shuffle(Array.from({length:totalCells}, function(_,i){ return i; }));
      for(var t=0;t<targetCount;t++) cellChars[idxPool[t]] = group.target;
      for(var i2=0;i2<totalCells;i2++){
        if(cellChars[i2]===null){
          var distractors = group.pool.filter(function(c){ return c!==group.target; });
          cellChars[i2] = distractors[rand(distractors.length)];
        }
      }
      body.innerHTML = "";
      body.appendChild(el("p",{class:"calc-hint"},["Rodada " + round + " de " + totalRounds + " · " + DIFFS[diffKey].label]));
      body.appendChild(el("div",{class:"symbol-target-bar"},[
        el("span",{},["Encontre:"]),
        el("span",{class:"symbol-target"},[group.target])
      ]));
      body.appendChild(el("div",{class:"symbol-progress"},["Encontrados: 0 / " + targetCount]));
      var grid = el("div",{class:"symbol-grid", style:"grid-template-columns:repeat("+diff.cols+",1fr);"});
      cellChars.forEach(function(ch){
        var cell = el("button",{class:"symbol-cell", type:"button"},[ch]);
        cell.addEventListener("click", function(){ onCellClick(cell, ch, group.target); });
        grid.appendChild(cell);
      });
      body.appendChild(grid);
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[
        el("button",{class:"btn ghost", onclick:function(){ giveUp(); }},["Desistir"])
      ]));
    }

    // Volta para a tela de configuração sem salvar nada.
    function giveUp(){ if(timerHandle) clearInterval(timerHandle); showIntro(); }

    function onCellClick(cell, ch, target){
      if(cell.classList.contains("found")) return;
      if(ch === target){
        cell.classList.add("found");
        cell.disabled = true;
        foundCount++; correctClicks++;
        body.querySelector(".symbol-progress").textContent = "Encontrados: " + foundCount + " / " + targetCount;
        if(foundCount >= targetCount){
          var roundMs = Date.now()-roundStartMs;
          setTimeout(function(){
            if(round < totalRounds){ round++; nextRound(); } else { finish(); }
          }, 350);
        }
      } else {
        falseClicks++;
        cell.classList.add("wrong-flash");
        cell.disabled = true;
        setTimeout(function(){ cell.classList.remove("wrong-flash"); }, 260);
      }
    }

    function finish(){
      clearInterval(timerHandle);
      var elapsedMs = Date.now()-startTime;
      var accuracy = (correctClicks+falseClicks) ? Math.round(correctClicks/(correctClicks+falseClicks)*100) : 100;
      var rec = {accuracy:accuracy, falseClicks:falseClicks, rounds:totalRounds, difficulty:diffKey, elapsedMs:elapsedMs};
      addRecord("symbolsearch", rec);
      body.innerHTML = "";
      showResult(panel, {
        big: accuracy+"%",
        metrics: [
          ["Tempo total", fmtTime(elapsedMs)],
          ["Cliques errados", String(falseClicks)],
          ["Dificuldade", DIFFS[diffKey].label]
        ],
        kind:"symbolsearch", ts:rec.ts, onRepeat:start
      });
    }

    return function cleanup(){ if(timerHandle) clearInterval(timerHandle); };
  }

  /* ============================= CHUTE CALIBRADO =============================
     Inspirado na pesquisa da Tali Sharot sobre otimismo e calibração de confiança:
     em vez de dar uma resposta única, o usuário dá uma faixa (mínimo/máximo). O que
     é avaliado não é só acertar, mas acertar com uma faixa bem calibrada — nem larga
     demais ("jogando seguro"), nem estreita demais (excesso de confiança). */
  var CALIBRATION_QUESTIONS = [
    {q:"Quantos ossos tem o corpo de um adulto?", unit:"ossos", answer:206},
    {q:"Em que ano começou a Segunda Guerra Mundial?", unit:"ano", answer:1939},
    {q:"Qual é a temperatura normal do corpo humano, em °C?", unit:"°C", answer:37},
    {q:"A que temperatura a água ferve ao nível do mar, em °C?", unit:"°C", answer:100},
    {q:"Qual a distância aproximada entre a Terra e a Lua, em km?", unit:"km", answer:384400},
    {q:"Quantas cartas tem um baralho padrão (sem coringas)?", unit:"cartas", answer:52},
    {q:"Em que ano Curitiba foi fundada?", unit:"ano", answer:1693},
    {q:"Quantos ossos tem cada pé humano?", unit:"ossos", answer:26},
    {q:"Quantos litros de sangue tem, em média, um adulto?", unit:"litros", answer:5},
    {q:"Quantas horas de sono os especialistas geralmente recomendam por noite, para um adulto?", unit:"horas", answer:8},
    {q:"Qual a altura aproximada do Monte Everest, em metros?", unit:"metros", answer:8849},
    {q:"Quantos países são hoje reconhecidos como membros da ONU?", unit:"países", answer:193}
  ];
  function renderCalibration(root){
    var COUNT_OPTIONS = [6, 8, 10];
    var totalQuestions = 8;

    var panel = el("div",{class:"panel"});
    var head = el("div",{class:"panel-head"},[ el("h2",{},["Chute Calibrado"]) ]);
    var body = el("div",{});
    panel.appendChild(head);
    panel.appendChild(body);
    root.appendChild(panel);

    var qIdx, questions, results, startTime;

    showIntro();

    function showIntro(){
      body.innerHTML = "";
      var countPicker = el("div",{class:"duration-picker"});
      COUNT_OPTIONS.forEach(function(n){
        var b = el("button",{"aria-pressed": n===totalQuestions?"true":"false", onclick:function(){
          totalQuestions = n;
          $all("button", countPicker).forEach(function(btn){ btn.setAttribute("aria-pressed", btn===b?"true":"false"); });
        }},[n+" perguntas"]);
        countPicker.appendChild(b);
      });
      body.appendChild(el("p",{class:"calc-hint"},["Para cada pergunta, dê uma faixa — um valor mínimo e um máximo — em que você acredita que a resposta certa esteja. O objetivo não é só acertar: é acertar com a faixa mais estreita possível."]));
      body.appendChild(countPicker);
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:18px;"},[
        el("button",{class:"btn", onclick:start},["Começar"])
      ]));
    }

    function start(){
      questions = pickN(CALIBRATION_QUESTIONS, Math.min(totalQuestions, CALIBRATION_QUESTIONS.length));
      qIdx = 0; results = [];
      startTime = Date.now();
      nextQuestion();
    }

    function nextQuestion(){
      body.innerHTML = "";
      var q = questions[qIdx];
      body.appendChild(el("p",{class:"calib-progress"},["Pergunta " + (qIdx+1) + " de " + questions.length]));
      body.appendChild(el("div",{class:"calib-question"},[q.q]));
      body.appendChild(el("div",{class:"calib-unit"},["Unidade: " + q.unit]));
      var minInput = el("input",{class:"calib-input", type:"number", inputmode:"decimal", placeholder:"mínimo"});
      var maxInput = el("input",{class:"calib-input", type:"number", inputmode:"decimal", placeholder:"máximo"});
      body.appendChild(el("div",{class:"calib-row"},[
        el("div",{class:"calib-field"},[el("label",{},["Mínimo"]), minInput]),
        el("div",{class:"calib-field"},[el("label",{},["Máximo"]), maxInput])
      ]));
      body.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:submit},["Confirmar"])
      ]));
      body.appendChild(el("div",{class:"actions-row", style:"margin-top:10px;"},[
        el("button",{class:"btn ghost", onclick:function(){ showIntro(); }},["Desistir"])
      ]));
      minInput.focus();

      function submit(){
        var min = parseFloat(minInput.value);
        var max = parseFloat(maxInput.value);
        if(!isFinite(min) || !isFinite(max)){ minInput.focus(); return; }
        if(min > max){ var t = min; min = max; max = t; }
        var hit = q.answer >= min && q.answer <= max;
        var widthPct = Math.abs(max-min) / Math.max(1, Math.abs(q.answer)) * 100;
        results.push({q:q.q, answer:q.answer, min:min, max:max, hit:hit, widthPct:widthPct});
        showFeedback(q, min, max, hit);
      }
    }

    function showFeedback(q, min, max, hit){
      body.innerHTML = "";
      body.appendChild(el("div",{class:"calib-feedback " + (hit?"hit":"miss")},[
        el("div",{},[hit ? "A resposta certa estava na sua faixa." : "A resposta certa ficou fora da sua faixa."]),
        el("div",{style:"margin-top:6px;"},["Sua faixa: " + min + " – " + max + " " + q.unit + " · Resposta certa: " + q.answer + " " + q.unit])
      ]));
      body.appendChild(el("div",{class:"actions-row"},[
        el("button",{class:"btn", onclick:function(){
          qIdx++;
          if(qIdx < questions.length) nextQuestion(); else finish();
        }},[qIdx < questions.length-1 ? "Próxima pergunta" : "Ver resultado"])
      ]));
    }

    function finish(){
      var elapsedMs = Date.now()-startTime;
      var hits = results.filter(function(r){ return r.hit; }).length;
      var accuracy = Math.round(hits/results.length*100);
      var avgWidthPct = Math.round(results.reduce(function(s,r){ return s+r.widthPct; },0)/results.length);
      var label;
      if(accuracy >= 70 && avgWidthPct <= 50) label = "Boa calibração";
      else if(accuracy >= 70 && avgWidthPct > 50) label = "Faixas largas — jogando seguro";
      else if(accuracy < 50) label = "Faixas estreitas — excesso de confiança";
      else label = "Calibração mediana";
      var rec = {total:results.length, hits:hits, accuracy:accuracy, avgWidthPct:avgWidthPct, label:label, elapsedMs:elapsedMs};
      addRecord("calibration", rec);
      body.innerHTML = "";
      showResult(panel, {
        big: hits + " / " + results.length,
        badges: [label],
        metrics: [
          ["Acertos na faixa", accuracy+"%"],
          ["Largura média da faixa", avgWidthPct+"% do valor"],
          ["Tempo total", fmtTime(elapsedMs)]
        ],
        kind:"calibration", ts:rec.ts, onRepeat:start
      });
    }

    return function cleanup(){};
  }

  function renderTipItems(container, items){
    items.forEach(function(it){
      var kids = [ el("div",{class:"t"},[it.t]), el("div",{class:"h"},[it.h]) ];
      if(it.w) kids.push(el("div",{class:"w"},[it.w]));
      container.appendChild(el("div",{class:"tip-item"}, kids));
    });
  }

  function renderTipSections(container, sections){
    sections.forEach(function(sec){
      container.appendChild(el("div",{class:"tip-section-heading"},[sec.heading]));
      renderTipItems(container, sec.items);
    });
  }

  function renderTips(root, categoryKey, subtabKey){
    root.innerHTML = "";
    if(!categoryKey){
      root.appendChild(el("h2",{style:"margin-bottom:8px;"},["Dicas para o dia a dia"]));
      root.appendChild(el("p",{class:"tips-intro"},["Cuidar da memória não é só treinar exercícios — hábitos de alimentação, sono, atividade física, convívio social e outras práticas fazem diferença real na saúde do cérebro. Escolha um tema abaixo."]));
      var grid = el("div",{class:"tips-grid"});
      TIPS_ORDER.forEach(function(key, idx){
        var t = TIPS[key];
        var card = el("button",{class:"tip-cat-card" + (idx===0?" featured":""), type:"button", onclick:function(){ setView("tips", {category:key}); }},[
          el("div",{class:"cat-illustration", html: TIP_ILLUSTRATIONS[key] || ""}),
          el("div",{class:"cat-head"},[
            el("div",{class:"icon", html:ICONS[t.icon]}),
            el("h3",{},[t.title])
          ]),
          el("p",{},[t.subtitle])
        ]);
        grid.appendChild(card);
      });
      root.appendChild(grid);
      return;
    }

    var cat = TIPS[categoryKey];
    if(!cat){ setView("tips"); return; }
    root.appendChild(el("button",{class:"tip-back", type:"button", onclick:function(){ setView("tips"); }},["← Todas as dicas"]));

    if(cat.subtabs){
      var activeKey = subtabKey || cat.subtabs[0].key;
      if(TIP_ILLUSTRATIONS[activeKey]) root.appendChild(el("div",{class:"tip-hero", html: TIP_ILLUSTRATIONS[activeKey]}));
      root.appendChild(el("h2",{style:"margin-bottom:6px;"},[cat.title]));
      root.appendChild(el("p",{class:"tips-intro"},[cat.subtitle]));

      root.appendChild(el("p",{class:"tips-intro"},["Questões no estilo que mais pega concurseiro de surpresa: pegadinhas de negação, silogismos com \"algum\"/\"nenhum\", problemas de V ou F e sequências fora do padrão. Cada resposta vem com a explicação do raciocínio — não é só acertar, é entender por quê."]));
      var grid = el("div",{class:"grid-cards"});
      CONCURSO_ORDER.forEach(function(key){
        var cat = CONCURSO_CATEGORIES[key];
        grid.appendChild(el("div",{class:"card"},[
          el("div",{class:"head"},[
            el("div",{class:"icon", html:ICONS[cat.icon]}),
            el("div",{},[el("h3",{},[cat.label])])
          ]),
          el("p",{},[cat.desc]),
          el("div",{class:"foot"},[
            el("span",{class:"concurso-cat-count"},[cat.questions.length + " questões"]),
            el("button",{class:"btn", onclick:function(){ startQuiz(key); }},["Praticar"])
          ])
        ]));
      });
      root.appendChild(grid);
    }

    function startQuiz(key){
      var cat = CONCURSO_CATEGORIES[key];
      var qIdx = 0, hits = 0;
      var startTime = Date.now();
      var panel = el("div",{class:"panel"});
      var head = el("div",{class:"panel-head"},[el("h2",{},[cat.label])]);
      panel.appendChild(head);
      root.innerHTML = "";
      root.appendChild(panel);

      showQuestion();

      function showQuestion(){
        while(panel.children.length>1) panel.removeChild(panel.lastChild);
        var q = cat.questions[qIdx];
        panel.appendChild(el("div",{class:"concurso-progress"},["Questão " + (qIdx+1) + " de " + cat.questions.length]));
        panel.appendChild(el("div",{class:"concurso-question"},[q.q]));
        var optsWrap = el("div",{class:"mc-options"});
        var optBtns = [];
        q.options.forEach(function(opt, oi){
          var b = el("button",{type:"button", class:"mc-option"},[opt]);
          b.addEventListener("click", function(){ answer(oi); });
          optBtns.push(b);
          optsWrap.appendChild(b);
        });
        panel.appendChild(optsWrap);
        panel.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[
          el("button",{class:"btn ghost", onclick:function(){ showCategoryGrid(); }},["Sair"])
        ]));

        function answer(oi){
          var ok = oi === q.answer;
          if(ok) hits++;
          optBtns.forEach(function(b, bi){
            b.disabled = true;
            if(bi === q.answer) b.classList.add("correct");
            else if(bi === oi) b.classList.add("wrong");
          });
          panel.appendChild(el("div",{class:"concurso-explanation " + (ok?"correct":"wrong")},[
            el("div",{class:"verdict"},[ok ? "✓ Correto" : "✗ Não é essa — a certa é: " + q.options[q.answer]]),
            el("div",{},[q.explanation])
          ]));
          var nextBtn = el("button",{class:"btn", onclick:function(){
            qIdx++;
            if(qIdx < cat.questions.length) showQuestion(); else finish();
          }},[qIdx < cat.questions.length-1 ? "Próxima questão" : "Ver resultado"]);
          panel.appendChild(el("div",{class:"actions-row", style:"margin-top:14px;"},[nextBtn]));
        }
      }

      function finish(){
        while(panel.children.length>1) panel.removeChild(panel.lastChild);
        var elapsedMs = Date.now()-startTime;
        var total = cat.questions.length;
        var accuracy = Math.round(hits/total*100);
        var rec = {category:key, categoryLabel:cat.label, correct:hits, total:total, accuracy:accuracy, elapsedMs:elapsedMs};
        addRecord("concursos", rec);
        showResult(panel, {
          big: hits + " / " + total,
          metrics: [["Acerto", accuracy+"%"], ["Categoria", cat.label], ["Tempo total", fmtTime(elapsedMs)]],
          kind:"concursos", ts:rec.ts, onRepeat:function(){ startQuiz(key); }
        });
      }
    }

    return function cleanup(){};
  }

  function sparkline(values, w, h){
    if(!values.length) return el("svg",{width:w, height:h});
    var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    var range = (max-min) || 1;
    var pts = values.map(function(v,i){
      var x = values.length===1 ? w/2 : (i/(values.length-1))*(w-8)+4;
      var y = h-4 - ((v-min)/range)*(h-8);
      return x+","+y;
    });
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("class","spark");
    svg.setAttribute("viewBox","0 0 "+w+" "+h);
    var line = document.createElementNS(svg.namespaceURI,"polyline");
    line.setAttribute("points", pts.join(" "));
    line.setAttribute("fill","none");
    line.setAttribute("stroke","var(--accent)");
    line.setAttribute("stroke-width","2");
    line.setAttribute("stroke-linecap","round");
    line.setAttribute("stroke-linejoin","round");
    svg.appendChild(line);
    var lastCoord = pts[pts.length-1].split(",");
    var dot = document.createElementNS(svg.namespaceURI,"circle");
    dot.setAttribute("cx", lastCoord[0]); dot.setAttribute("cy", lastCoord[1]); dot.setAttribute("r","3");
    dot.setAttribute("fill","var(--accent)");
    svg.appendChild(dot);
    return svg;
  }

  function renderHistory(root){

    // Botões de "apagar" nesta tela usam confirmação de dois cliques em vez de
    // window.confirm(), que fica bloqueado dentro do artifact e nunca abre.
    function confirmClickButton(opts){
      // opts: {className, idleLabel, confirmLabel, confirmClass, onConfirm, title}
      var btn = el("button",{class:opts.className, type:"button", title:opts.title||""},[opts.idleLabel]);
      var confirming = false, revertHandle = null;
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(!confirming){
          confirming = true;
          btn.textContent = opts.confirmLabel;
          if(opts.confirmClass) btn.classList.add(opts.confirmClass);
          revertHandle = setTimeout(function(){
            confirming = false;
            btn.textContent = opts.idleLabel;
            if(opts.confirmClass) btn.classList.remove(opts.confirmClass);
          }, 4000);
        } else {
          if(revertHandle) clearTimeout(revertHandle);
          opts.onConfirm();
        }
      });
      return btn;
    }
